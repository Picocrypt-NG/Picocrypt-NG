name: AppImage dependency review

permissions:
  contents: read

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

concurrency:
  group: appimage-dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Compare locked packages with current signed Jammy indexes
      shell: bash
      run: bash .github/scripts/check-appimage-dependency-updates.sh
