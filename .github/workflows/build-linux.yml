name: build-linux

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to the GitHub release. Existing assets are never overwritten."
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      canonical_manifest_sha256:
        required: true
        type: string
      amd64_artifact_id:
        required: true
        type: string
      amd64_artifact_digest:
        required: true
        type: string
      amd64_producing_attempt:
        required: true
        type: string
      arm64_artifact_id:
        required: true
        type: string
      arm64_artifact_digest:
        required: true
        type: string
      arm64_producing_attempt:
        required: true
        type: string
    outputs:
      staged:
        description: True only after full remote reuse or successful stage-only upload.
        value: ${{ jobs.inspect.outputs.staged == 'true' && 'true' || jobs.attest.outputs.staged == 'true' && 'true' || jobs.stage.outputs.staged }}
      reused:
        description: Whether a fresh full remote owner set was reused.
        value: ${{ jobs.inspect.outputs.reused == 'true' || jobs.attest.outputs.reused == 'true' }}
      generation_id:
        description: Exact immutable full signed generation ID, when one was produced.
        value: ${{ jobs.attest.outputs.generation-id }}
      generation_digest:
        description: Official digest of that exact signed generation ZIP.
        value: ${{ jobs.attest.outputs.generation-digest }}
      generation_attempt:
        description: Producing attempt of the retained signed generation.
        value: ${{ jobs.attest.outputs.generation-attempt }}

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-linux.yml@{1}', github.repository, github.ref) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      version: ${{ steps.source.outputs.version }}
      manifest-digest: ${{ steps.source.outputs.manifest-digest }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Validate release request
      shell: bash
      env:
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
        SIGNPATH_TEST: "false"
        SIGNPATH_RELEASE_DRY_RUN: "false"
        SOURCE_REF: ${{ github.ref }}
        SOURCE_EVENT: ${{ github.event_name }}
      run: bash .github/scripts/validate-release-request.sh

    - name: Bind source and canonical manifest
      id: source
      shell: bash
      env:
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$version" | sha256sum)
        {
          echo "source-sha=$SOURCE_SHA"
          echo "version=$version"
          echo "manifest-digest=${digest%% *}"
        } >> "$GITHUB_OUTPUT"

  build-amd64:
    if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-linux.yml@{1}', github.repository, github.ref) }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native Linux artifacts
      id: build
      uses: ./.github/actions/build-linux
      with:
        arch: amd64
        upx_pkg: upx-5.2.1-amd64_linux
        upx_sha256: 402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657
        gui_binary: Picocrypt-NG
        cli_binary: Picocrypt-NG-cli
        build_deb: "true"
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}

  build-arm64:
    if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-linux.yml@{1}', github.repository, github.ref) }}
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native Linux artifacts
      id: build
      uses: ./.github/actions/build-linux
      with:
        arch: arm64
        upx_pkg: upx-5.2.1-arm64_linux
        upx_sha256: a72d112c5970a904a31da0b9c84f919bc16b9a311787c12245508544a78c7d36
        gui_binary: Picocrypt-NG-arm64
        cli_binary: Picocrypt-NG-cli-arm64
        build_deb: "false"
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}

  verify-linux:
    needs: [prepare, build-amd64, build-arm64]
    if: ${{ always() && github.workflow_ref == format('{0}/.github/workflows/build-linux.yml@{1}', github.repository, github.ref) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
      SOURCE_VERSION: ${{ needs.prepare.outputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-digest }}
      AMD64_ARTIFACT_ID: ${{ needs.build-amd64.outputs.artifact-id }}
      AMD64_ARTIFACT_DIGEST: ${{ needs.build-amd64.outputs.artifact-digest }}
      AMD64_RUN_ATTEMPT: ${{ needs.build-amd64.outputs.run-attempt }}
      ARM64_ARTIFACT_ID: ${{ needs.build-arm64.outputs.artifact-id }}
      ARM64_ARTIFACT_DIGEST: ${{ needs.build-arm64.outputs.artifact-digest }}
      ARM64_RUN_ATTEMPT: ${{ needs.build-arm64.outputs.run-attempt }}
      ARTIFACT_ROOT: artifacts
      LINUX_MANIFEST: ${{ github.workspace }}/linux-artifacts.json
    steps:
    - name: Require both Linux producers
      shell: bash
      env:
        AMD64_RESULT: ${{ needs.build-amd64.result }}
        ARM64_RESULT: ${{ needs.build-arm64.result }}
      run: |
        set -euo pipefail
        [[ "$AMD64_RESULT" == success && "$ARM64_RESULT" == success ]]

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh

    - name: Verify immutable Linux artifact metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/build-linux/verify-artifacts.sh metadata

    - name: Download Linux AMD64 artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-amd64.outputs.artifact-id }}
        path: artifacts/build-linux-amd64
        merge-multiple: true
        digest-mismatch: error

    - name: Download Linux ARM64 artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-arm64.outputs.artifact-id }}
        path: artifacts/build-linux-arm64
        merge-multiple: true
        digest-mismatch: error

    - name: Verify Linux payload manifests
      shell: bash
      run: bash .github/actions/build-linux/verify-artifacts.sh payload

    - name: Upload Linux verification manifest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux-validation-attempt-${{ github.run_attempt }}
        path: ${{ env.LINUX_MANIFEST }}
        if-no-files-found: error
        retention-days: 7
        overwrite: false

    - name: Report Linux pilot scope
      shell: bash
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
        This is a partial Linux pilot: AMD64 and ARM64 only.

        Linux primary assets: built 5, verified 5, signed 0, staged 0, published 0.
        Other platform lanes, the complete 19-asset validation, recovery and publish mode are not implemented.
        Hosted failed-only rerun and retention behavior still require service-level acceptance.
        EOF

  release:
    needs: [prepare, build-amd64, build-arm64, verify-linux]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release && github.workflow_ref == format('{0}/.github/workflows/build-linux.yml@{1}', github.repository, github.ref) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
      SOURCE_VERSION: ${{ needs.prepare.outputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-digest }}
      AMD64_ARTIFACT_ID: ${{ needs.build-amd64.outputs.artifact-id }}
      AMD64_ARTIFACT_DIGEST: ${{ needs.build-amd64.outputs.artifact-digest }}
      AMD64_RUN_ATTEMPT: ${{ needs.build-amd64.outputs.run-attempt }}
      ARM64_ARTIFACT_ID: ${{ needs.build-arm64.outputs.artifact-id }}
      ARM64_ARTIFACT_DIGEST: ${{ needs.build-arm64.outputs.artifact-digest }}
      ARM64_RUN_ATTEMPT: ${{ needs.build-arm64.outputs.run-attempt }}
      ARTIFACT_ROOT: artifacts
      LINUX_MANIFEST: ${{ github.workspace }}/linux-artifacts.json
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh

    - name: Verify immutable Linux artifact metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/build-linux/verify-artifacts.sh metadata

    - name: Download Linux AMD64 artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-amd64.outputs.artifact-id }}
        path: artifacts/build-linux-amd64
        merge-multiple: true
        digest-mismatch: error

    - name: Download Linux ARM64 artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-arm64.outputs.artifact-id }}
        path: artifacts/build-linux-arm64
        merge-multiple: true
        digest-mismatch: error

    - name: Verify Linux payload manifests
      shell: bash
      run: bash .github/actions/build-linux/verify-artifacts.sh payload

    - name: Get version tag
      run: |
        VERSION=$(cat VERSION)
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Sign and attest artifacts
      uses: ./.github/actions/sign-and-attest
      with:
        paths: |
          artifacts/build-linux-amd64/Picocrypt-NG
          artifacts/build-linux-amd64/Picocrypt-NG-cli
          artifacts/build-linux-amd64/Picocrypt-NG.deb
          artifacts/build-linux-arm64/Picocrypt-NG-arm64
          artifacts/build-linux-arm64/Picocrypt-NG-cli-arm64

    - name: Generate release notes
      uses: ./.github/actions/release-body
      with:
        version: ${{ env.VERSION }}

    - name: Stage release assets
      uses: ./.github/actions/stage-release
      with:
        version: ${{ env.VERSION }}
        body_path: ${{ github.workspace }}/release-body.md
        files: |
          artifacts/build-linux-amd64/Picocrypt-NG
          artifacts/build-linux-amd64/Picocrypt-NG.sigstore.json
          artifacts/build-linux-amd64/Picocrypt-NG-cli
          artifacts/build-linux-amd64/Picocrypt-NG-cli.sigstore.json
          artifacts/build-linux-amd64/Picocrypt-NG.deb
          artifacts/build-linux-amd64/Picocrypt-NG.deb.sigstore.json
          artifacts/build-linux-arm64/Picocrypt-NG-arm64
          artifacts/build-linux-arm64/Picocrypt-NG-arm64.sigstore.json
          artifacts/build-linux-arm64/Picocrypt-NG-cli-arm64
          artifacts/build-linux-arm64/Picocrypt-NG-cli-arm64.sigstore.json

  inspect:
    if: ${{ github.workflow_ref != format('{0}/.github/workflows/build-linux.yml@{1}', github.repository, github.ref) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      OWNER_WORKFLOW: build-linux.yml
    outputs:
      state: ${{ steps.inventory.outputs.state }}
      staged: ${{ steps.inventory.outputs.staged }}
      reused: ${{ steps.inventory.outputs.reused }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable Linux source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Inspect full Linux owner
      id: inventory
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        report=$(mktemp)
        trap 'rm -f "$report"' EXIT
        GITHUB_OUTPUT='' bash .github/actions/stage-release/release-gate.sh inspect-owner "$SOURCE_VERSION" > "$report"
        jq -e --arg source "$SOURCE_SHA" --arg version "$SOURCE_VERSION" --arg canonical "$CANONICAL_MANIFEST_SHA256" '
          .repository == "Picocrypt-NG/Picocrypt-NG" and .source_sha == $source and .version == $version and
          .canonical_manifest_sha256 == $canonical and .owner_workflow == "build-linux.yml"
        ' "$report" >/dev/null
        state=$(jq -r '.status' "$report")
        case "$state" in
          complete) staged=true; reused=true ;;
          missing) staged=false; reused=false ;;
          partial) echo 'Linux owner is partially staged; original signed generation is required before any signing' >&2; exit 1 ;;
          *) echo 'Invalid Linux owner inspection state' >&2; exit 1 ;;
        esac
        printf 'state=%s\nstaged=%s\nreused=%s\n' "$state" "$staged" "$reused" >> "$GITHUB_OUTPUT"
  attest:
    needs: inspect
    if: ${{ needs.inspect.outputs.state != 'complete' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      OWNER_WORKFLOW: build-linux.yml
      ARTIFACT_ROOT: artifacts
      LINUX_MANIFEST: ${{ github.workspace }}/linux-artifacts.json
      GENERATION_OWNER: build-linux.yml
      GENERATION_DIR: signed-generation
      AMD64_ARTIFACT_ID: ${{ inputs.amd64_artifact_id }}
      AMD64_ARTIFACT_DIGEST: ${{ inputs.amd64_artifact_digest }}
      AMD64_RUN_ATTEMPT: ${{ inputs.amd64_producing_attempt }}
      ARM64_ARTIFACT_ID: ${{ inputs.arm64_artifact_id }}
      ARM64_ARTIFACT_DIGEST: ${{ inputs.arm64_artifact_digest }}
      ARM64_RUN_ATTEMPT: ${{ inputs.arm64_producing_attempt }}
    outputs:
      state: ${{ steps.inventory.outputs.state }}
      staged: ${{ steps.inventory.outputs.staged }}
      reused: ${{ steps.inventory.outputs.reused }}
      generation-id: ${{ steps.upload-generation.outputs.artifact-id }}
      generation-digest: ${{ steps.upload-generation.outputs.artifact-digest }}
      generation-attempt: ${{ steps.generation.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable Linux source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Inspect full Linux owner
      id: inventory
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        report=$(mktemp)
        trap 'rm -f "$report"' EXIT
        GITHUB_OUTPUT='' bash .github/actions/stage-release/release-gate.sh inspect-owner "$SOURCE_VERSION" > "$report"
        jq -e --arg source "$SOURCE_SHA" --arg version "$SOURCE_VERSION" --arg canonical "$CANONICAL_MANIFEST_SHA256" '
          .repository == "Picocrypt-NG/Picocrypt-NG" and .source_sha == $source and .version == $version and
          .canonical_manifest_sha256 == $canonical and .owner_workflow == "build-linux.yml"
        ' "$report" >/dev/null
        state=$(jq -r '.status' "$report")
        case "$state" in
          complete) staged=true; reused=true ;;
          missing) staged=false; reused=false ;;
          partial) echo 'Linux owner is partially staged; original signed generation is required before any signing' >&2; exit 1 ;;
          *) echo 'Invalid Linux owner inspection state' >&2; exit 1 ;;
        esac
        printf 'state=%s\nstaged=%s\nreused=%s\n' "$state" "$staged" "$reused" >> "$GITHUB_OUTPUT"
    - name: Verify immutable Linux artifact metadata
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/build-linux/verify-artifacts.sh metadata
    - name: Download Linux AMD64 artifact
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.amd64_artifact_id }}
        path: artifacts/build-linux-amd64
        merge-multiple: true
        digest-mismatch: error
    - name: Download Linux ARM64 artifact
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.arm64_artifact_id }}
        path: artifacts/build-linux-arm64
        merge-multiple: true
        digest-mismatch: error
    - name: Verify Linux payload manifests
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      run: bash .github/actions/build-linux/verify-artifacts.sh payload
    - name: Sign and attest artifacts
      uses: ./.github/actions/sign-and-attest
      with:
        paths: |
          artifacts/build-linux-amd64/Picocrypt-NG
          artifacts/build-linux-amd64/Picocrypt-NG-cli
          artifacts/build-linux-amd64/Picocrypt-NG.deb
          artifacts/build-linux-arm64/Picocrypt-NG-arm64
          artifacts/build-linux-arm64/Picocrypt-NG-cli-arm64
      if: ${{ steps.inventory.outputs.state == 'missing' }}
    - name: Record signed Linux generation
      id: generation
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/signed-generation/generation.sh record
    - name: Upload signed Linux generation
      id: upload-generation
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.generation.outputs.artifact-name }}
        path: signed-generation/*
        if-no-files-found: error
        compression-level: 9
        retention-days: 7
        overwrite: false
  stage:
    needs: attest
    if: ${{ needs.attest.outputs.state != 'complete' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      GENERATION_OWNER: build-linux.yml
      GENERATION_DIR: signed-generation
      GENERATION_ARTIFACT_ID: ${{ needs.attest.outputs.generation-id }}
      GENERATION_ARTIFACT_DIGEST: ${{ needs.attest.outputs.generation-digest }}
      GENERATION_ARTIFACT_ATTEMPT: ${{ needs.attest.outputs.generation-attempt }}
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable Linux source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Verify signed generation metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/signed-generation/generation.sh metadata
    - name: Download signed Linux generation
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.attest.outputs.generation-id }}
        path: signed-generation
        merge-multiple: true
        digest-mismatch: error
    - name: Restore signed Linux generation
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/signed-generation/generation.sh restore
    - name: Generate release notes
      uses: ./.github/actions/release-body
      with:
        version: ${{ inputs.version }}
    - name: Stage release assets
      id: stage
      uses: ./.github/actions/stage-release
      with:
        version: ${{ inputs.version }}
        body_path: ${{ github.workspace }}/release-body.md
        files: |
          artifacts/build-linux-amd64/Picocrypt-NG
          artifacts/build-linux-amd64/Picocrypt-NG.sigstore.json
          artifacts/build-linux-amd64/Picocrypt-NG-cli
          artifacts/build-linux-amd64/Picocrypt-NG-cli.sigstore.json
          artifacts/build-linux-amd64/Picocrypt-NG.deb
          artifacts/build-linux-amd64/Picocrypt-NG.deb.sigstore.json
          artifacts/build-linux-arm64/Picocrypt-NG-arm64
          artifacts/build-linux-arm64/Picocrypt-NG-arm64.sigstore.json
          artifacts/build-linux-arm64/Picocrypt-NG-cli-arm64
          artifacts/build-linux-arm64/Picocrypt-NG-cli-arm64.sigstore.json
        finalize: 'false'
