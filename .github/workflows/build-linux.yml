name: build-linux

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to the GitHub release. Existing assets are never overwritten."
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      version: ${{ steps.source.outputs.version }}
      manifest-digest: ${{ steps.source.outputs.manifest-digest }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Validate release request
      shell: bash
      env:
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
        SIGNPATH_TEST: "false"
        SIGNPATH_RELEASE_DRY_RUN: "false"
        SOURCE_REF: ${{ github.ref }}
        SOURCE_EVENT: ${{ github.event_name }}
      run: bash .github/scripts/validate-release-request.sh

    - name: Bind source and canonical manifest
      id: source
      shell: bash
      env:
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$version" | sha256sum)
        {
          echo "source-sha=$SOURCE_SHA"
          echo "version=$version"
          echo "manifest-digest=${digest%% *}"
        } >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native Linux artifacts
      id: build
      uses: ./.github/actions/build-linux
      with:
        arch: amd64
        upx_pkg: upx-5.2.1-amd64_linux
        upx_sha256: 402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657
        gui_binary: Picocrypt-NG
        cli_binary: Picocrypt-NG-cli
        build_deb: "true"
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native Linux artifacts
      id: build
      uses: ./.github/actions/build-linux
      with:
        arch: arm64
        upx_pkg: upx-5.2.1-arm64_linux
        upx_sha256: a72d112c5970a904a31da0b9c84f919bc16b9a311787c12245508544a78c7d36
        gui_binary: Picocrypt-NG-arm64
        cli_binary: Picocrypt-NG-cli-arm64
        build_deb: "false"
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}

  verify-linux:
    needs: [prepare, build-amd64, build-arm64]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
      SOURCE_VERSION: ${{ needs.prepare.outputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-digest }}
      AMD64_ARTIFACT_ID: ${{ needs.build-amd64.outputs.artifact-id }}
      AMD64_ARTIFACT_DIGEST: ${{ needs.build-amd64.outputs.artifact-digest }}
      AMD64_RUN_ATTEMPT: ${{ needs.build-amd64.outputs.run-attempt }}
      ARM64_ARTIFACT_ID: ${{ needs.build-arm64.outputs.artifact-id }}
      ARM64_ARTIFACT_DIGEST: ${{ needs.build-arm64.outputs.artifact-digest }}
      ARM64_RUN_ATTEMPT: ${{ needs.build-arm64.outputs.run-attempt }}
      ARTIFACT_ROOT: artifacts
      LINUX_MANIFEST: ${{ github.workspace }}/linux-artifacts.json
    steps:
    - name: Require both Linux producers
      shell: bash
      env:
        AMD64_RESULT: ${{ needs.build-amd64.result }}
        ARM64_RESULT: ${{ needs.build-arm64.result }}
      run: |
        set -euo pipefail
        [[ "$AMD64_RESULT" == success && "$ARM64_RESULT" == success ]]

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh

    - name: Verify immutable Linux artifact metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/build-linux/verify-artifacts.sh metadata

    - name: Download Linux AMD64 artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-amd64.outputs.artifact-id }}
        path: artifacts/build-linux-amd64
        merge-multiple: true
        digest-mismatch: error

    - name: Download Linux ARM64 artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-arm64.outputs.artifact-id }}
        path: artifacts/build-linux-arm64
        merge-multiple: true
        digest-mismatch: error

    - name: Verify Linux payload manifests
      shell: bash
      run: bash .github/actions/build-linux/verify-artifacts.sh payload

    - name: Upload Linux verification manifest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux-validation-attempt-${{ github.run_attempt }}
        path: ${{ env.LINUX_MANIFEST }}
        if-no-files-found: error
        retention-days: 7
        overwrite: false

    - name: Report Linux pilot scope
      shell: bash
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
        This is a partial Linux pilot: AMD64 and ARM64 only.

        Linux primary assets: built 5, verified 5, signed 0, staged 0, published 0.
        Other platform lanes, the complete 19-asset validation, recovery and publish mode are not implemented.
        Hosted failed-only rerun and retention behavior still require service-level acceptance.
        EOF

  release:
    needs: [prepare, build-amd64, build-arm64, verify-linux]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
      SOURCE_VERSION: ${{ needs.prepare.outputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-digest }}
      AMD64_ARTIFACT_ID: ${{ needs.build-amd64.outputs.artifact-id }}
      AMD64_ARTIFACT_DIGEST: ${{ needs.build-amd64.outputs.artifact-digest }}
      AMD64_RUN_ATTEMPT: ${{ needs.build-amd64.outputs.run-attempt }}
      ARM64_ARTIFACT_ID: ${{ needs.build-arm64.outputs.artifact-id }}
      ARM64_ARTIFACT_DIGEST: ${{ needs.build-arm64.outputs.artifact-digest }}
      ARM64_RUN_ATTEMPT: ${{ needs.build-arm64.outputs.run-attempt }}
      ARTIFACT_ROOT: artifacts
      LINUX_MANIFEST: ${{ github.workspace }}/linux-artifacts.json
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh

    - name: Verify immutable Linux artifact metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/build-linux/verify-artifacts.sh metadata

    - name: Download Linux AMD64 artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-amd64.outputs.artifact-id }}
        path: artifacts/build-linux-amd64
        merge-multiple: true
        digest-mismatch: error

    - name: Download Linux ARM64 artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-arm64.outputs.artifact-id }}
        path: artifacts/build-linux-arm64
        merge-multiple: true
        digest-mismatch: error

    - name: Verify Linux payload manifests
      shell: bash
      run: bash .github/actions/build-linux/verify-artifacts.sh payload

    - name: Get version tag
      run: |
        VERSION=$(cat VERSION)
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Sign and attest artifacts
      uses: ./.github/actions/sign-and-attest
      with:
        paths: |
          artifacts/build-linux-amd64/Picocrypt-NG
          artifacts/build-linux-amd64/Picocrypt-NG-cli
          artifacts/build-linux-amd64/Picocrypt-NG.deb
          artifacts/build-linux-arm64/Picocrypt-NG-arm64
          artifacts/build-linux-arm64/Picocrypt-NG-cli-arm64

    - name: Generate release notes
      uses: ./.github/actions/release-body
      with:
        version: ${{ env.VERSION }}

    - name: Stage release assets
      uses: ./.github/actions/stage-release
      with:
        version: ${{ env.VERSION }}
        body_path: ${{ github.workspace }}/release-body.md
        files: |
          artifacts/build-linux-amd64/Picocrypt-NG
          artifacts/build-linux-amd64/Picocrypt-NG.sigstore.json
          artifacts/build-linux-amd64/Picocrypt-NG-cli
          artifacts/build-linux-amd64/Picocrypt-NG-cli.sigstore.json
          artifacts/build-linux-amd64/Picocrypt-NG.deb
          artifacts/build-linux-amd64/Picocrypt-NG.deb.sigstore.json
          artifacts/build-linux-arm64/Picocrypt-NG-arm64
          artifacts/build-linux-arm64/Picocrypt-NG-arm64.sigstore.json
          artifacts/build-linux-arm64/Picocrypt-NG-cli-arm64
          artifacts/build-linux-arm64/Picocrypt-NG-cli-arm64.sigstore.json
