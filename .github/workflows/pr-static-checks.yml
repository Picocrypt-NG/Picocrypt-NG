name: pr-static-checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup workflow linters
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      env:
        MISE_ENABLE_TOOLS: jactionlint,shellcheck,ruff
      with:
        version: 2026.10.25
        install_args: jactionlint shellcheck ruff
        cache_key_prefix: mise-workflow-linters

    - name: Lint GitHub Actions workflows
      env:
        MISE_ENABLE_TOOLS: jactionlint,shellcheck,ruff
      run: mise run workflows:lint

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27.3"
        cache-dependency-path: src/go.sum

    # GUI packages (internal/ui) import Fyne, so vet/lint/govulncheck need the
    # same CGO/OpenGL headers the Linux build job installs.
    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y gcc pkg-config libgl1-mesa-dev xorg-dev libgtk-3-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev

    - name: Install dependencies
      run: |
        cd src
        go mod download

    - name: Check formatting (gofmt)
      run: |
        cd src
        unformatted=$(gofmt -l .)
        unformatted=$(printf '%s\n' "$unformatted" | grep -v '^testdata/legacy/' || true)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-clean (run: gofmt -w <file>):"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: |
        cd src
        CGO_ENABLED=1 go vet -tags migrated_fynedo ./...

    # Pin the linter: the v2 src/.golangci.yml schema is version-sensitive, so
    # @latest would make CI non-reproducible.
    - name: Lint (golangci-lint)
      run: |
        cd src
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
        go_bin_dir="$(go env GOPATH)/bin"
        export PATH="$PATH:$go_bin_dir"
        golangci-lint run --build-tags migrated_fynedo ./...

    - name: Setup uv for tooling tests
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.5"
        enable-cache: false

    - name: Test tooling integration
      env:
        MISE_ENABLE_TOOLS: go,golangci-lint,hk,jouet,jactionlint,shellcheck,ruff
      run: |
        mise install go golangci-lint hk jouet
        go_bin_dir="$(go env GOPATH)/bin"
        export PATH="$PATH:$go_bin_dir"
        mise run tooling:test

    - name: Check Go tooling fmt
      env:
        MISE_ENABLE_TOOLS: go
      run: mise run tooling:fmt

    - name: Check Go tooling lint
      env:
        MISE_ENABLE_TOOLS: go,golangci-lint
      run: mise run tooling:lint

    - name: Vulnerability scan (govulncheck)
      run: |
        cd src
        go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
        go_bin_dir="$(go env GOPATH)/bin"
        export PATH="$PATH:$go_bin_dir"
        govulncheck -tags migrated_fynedo ./...
