name: pr-test-build-windows-legacy

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-test-build-windows-legacy:
    runs-on: windows-2022
    env:
      GOTOOLCHAIN: local
      GOAMD64: v1
      GOEXPERIMENT: ""
      UPX_SHA256: eabc6792a347d45e945be7748423e7868fd01b0d2bcaa2f4b1031fd71ff69bda
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build patched Go 1.27.2 for Windows 7/8
      shell: pwsh
      run: |
        & .github/scripts/build-legacy-go.ps1 `
          -ManifestPath '.github/toolchains/legacy-go/manifest.json' `
          -OutputRoot 'C:\go-legacy'

    - name: Add go-legacy-win7 to PATH
      shell: pwsh
      run: |
        echo "C:\go-legacy\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify Go installation
      shell: pwsh
      run: |
        $expectedGo = (Resolve-Path 'C:\go-legacy\go\bin\go.exe').Path
        $actualGo = (Get-Command go -CommandType Application | Select-Object -First 1).Source
        if ($actualGo -ne $expectedGo) { throw "Unexpected go.exe: $actualGo; want $expectedGo" }
        $expectedRoot = (Resolve-Path 'C:\go-legacy\go').Path
        $goEnvironment = go env -json GOROOT GOVERSION GOTOOLCHAIN GOOS GOARCH GOAMD64 GOEXPERIMENT
        if ($LASTEXITCODE -ne 0) { throw 'Could not inspect legacy Go installation' }
        $goEnvironment = $goEnvironment | ConvertFrom-Json
        if ($goEnvironment.GOROOT -ne $expectedRoot) { throw 'Unexpected legacy GOROOT' }
        if ($goEnvironment.GOVERSION -ne 'go1.27.2') { throw 'Unexpected legacy Go version' }
        if ($goEnvironment.GOTOOLCHAIN -ne 'local') { throw 'GOTOOLCHAIN must be local' }
        if ($goEnvironment.GOOS -ne 'windows' -or $goEnvironment.GOARCH -ne 'amd64' -or
            $goEnvironment.GOAMD64 -ne 'v1' -or $goEnvironment.GOEXPERIMENT -ne '') { throw 'Unexpected legacy Go build settings' }
        go version
        if ($LASTEXITCODE -ne 0) { throw 'Legacy Go compiler failed to execute' }

    - name: Run native legacy toolchain regressions
      shell: pwsh
      run: |
        & .github/scripts/run-windows-native-tests.ps1 `
          -GoExecutable 'C:\go-legacy\go\bin\go.exe' `
          -GoArguments @('test', '-v', '-count=1', '-p', '1', '-timeout', '15m', 'os', 'internal/syscall/windows', 'crypto/internal/sysrand')
        if ($LASTEXITCODE -ne 0) { throw 'Native legacy filesystem and random-source regressions failed' }
        & .github/scripts/run-windows-native-tests.ps1 `
          -GoExecutable 'C:\go-legacy\go\bin\go.exe' `
          -GoArguments @('test', '-v', '-count=1', '-p', '1', '-timeout', '15m', '-run', '^TestReadRandomFromRtlGenRandom$', 'runtime')
        if ($LASTEXITCODE -ne 0) { throw 'Native legacy runtime random-source regression failed' }

    - name: Install dependencies
      run: |
        cd src
        go mod download

    - name: Verify native test launcher controls
      shell: pwsh
      run: |
        & .github/scripts/test-windows-native-tests.ps1

    - name: Run tests
      shell: pwsh
      run: |
        & .github/scripts/run-windows-native-tests.ps1 `
          -GoExecutable 'C:\go-legacy\go\bin\go.exe' `
          -GoArguments @('test', '-v', '-count=1', '-p', '1', '-timeout', '15m', './internal/cli', './internal/fileops', './internal/volume')
      env:
        PICOCRYPT_RUN_CLI_INTEGRATION: 1

    - name: Build CLI-only legacy binary
      run: |
        cd src
        go build -v -tags cli -ldflags="-s -w -extldflags=-static" -o Picocrypt-NG-cli-Legacy.exe ./cmd/picocrypt
      env:
        CGO_ENABLED: 1
        GOAMD64: v1

    - name: Verify legacy binary toolchain
      shell: pwsh
      run: |
        $buildInfo = go version -m src/Picocrypt-NG-cli-Legacy.exe | Out-String
        if ($LASTEXITCODE -ne 0) { throw 'Could not inspect legacy CLI build metadata' }
        if ($buildInfo -notmatch '(?m)^[^\r\n]*: go1\.27\.2\r?$') { throw 'Legacy CLI was not built by Go 1.27.2' }
        if ($buildInfo -notmatch '(?m)^\tbuild\tGOAMD64=v1\r?$') { throw 'Legacy CLI requires unsupported CPU instructions' }
        & .github/scripts/assert-windows-legacy-pe.ps1 -Path 'src/Picocrypt-NG-cli-Legacy.exe'
        $buildInfo

    - name: Compress with upx
      shell: pwsh
      run: |
        curl.exe `
          --fail `
          --location `
          --silent `
          --show-error `
          --retry 3 `
          --retry-all-errors `
          --retry-delay 2 `
          --connect-timeout 30 `
          --max-time 300 `
          --retry-max-time 600 `
          --remove-on-error `
          --output upx.zip `
          https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-win64.zip
        if ($LASTEXITCODE -ne 0) {
          throw "UPX download failed with exit code $LASTEXITCODE"
        }
        $expectedHash = $env:UPX_SHA256
        $actualHash = (Get-FileHash upx.zip -Algorithm SHA256).Hash.ToLower()
        if ($actualHash -ne $expectedHash) {
          throw "Checksum mismatch for upx.zip: expected $expectedHash, got $actualHash"
        }
        Expand-Archive -DestinationPath upx upx.zip
        upx/upx-5.2.1-win64/upx.exe --lzma src/Picocrypt-NG-cli-Legacy.exe

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pr-test-build-windows-legacy-ONLY-FOR-TESTING
        path: src/Picocrypt-NG-cli-Legacy.exe
        if-no-files-found: error
        compression-level: 9
