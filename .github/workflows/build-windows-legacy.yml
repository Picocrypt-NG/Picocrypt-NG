name: build-windows-legacy

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to the GitHub release. Existing assets are never overwritten."
        required: false
        type: boolean
        default: false
      signpath_test:
        description: "Submit the legacy CLI to SignPath with the self-signed test policy. Never publishes a GitHub release."
        required: false
        type: boolean
        default: false
      signpath_release_dry_run:
        description: "Validate the SignPath release policy without uploading signed output or publishing a GitHub release."
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      canonical_manifest_sha256:
        required: true
        type: string
      raw_artifact_id:
        required: true
        type: string
      raw_artifact_digest:
        required: true
        type: string
      raw_producing_attempt:
        required: true
        type: string
      signing_input_id:
        required: true
        type: string
      signing_input_digest:
        required: true
        type: string
      signing_input_attempt:
        required: true
        type: string
    secrets:
      SIGNPATH_API_TOKEN:
        required: true
    outputs:
      staged:
        description: True after full owner reuse or successful stage-only upload.
        value: ${{ jobs.inspect.outputs.staged == 'true' && 'true' || jobs.sign.outputs.staged == 'true' && 'true' || jobs.attest.outputs.staged == 'true' && 'true' || jobs.stage.outputs.staged }}
      reused:
        description: Whether a fresh full remote owner set was reused.
        value: ${{ jobs.inspect.outputs.reused == 'true' || jobs.sign.outputs.reused == 'true' || jobs.attest.outputs.reused == 'true' }}
      generation_id:
        description: Exact immutable full signed generation ID.
        value: ${{ jobs.attest.outputs.generation-id }}
      generation_digest:
        description: Official ZIP digest of that signed generation.
        value: ${{ jobs.attest.outputs.generation-digest }}
      generation_attempt:
        description: Producing attempt of the retained signed generation.
        value: ${{ jobs.attest.outputs.generation-attempt }}

concurrency:
  group: build-windows-legacy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) }}
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      signing-input-id: ${{ steps.build.outputs.signing-input-id }}
    env:
      GOTOOLCHAIN: local
      GOAMD64: v1
      GOEXPERIMENT: ""
      UPX_SHA256: eabc6792a347d45e945be7748423e7868fd01b0d2bcaa2f4b1031fd71ff69bda
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate release request
      shell: bash
      env:
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
        SIGNPATH_TEST: ${{ inputs.signpath_test }}
        SIGNPATH_RELEASE_DRY_RUN: ${{ inputs.signpath_release_dry_run }}
        SOURCE_REF: ${{ github.ref }}
        SOURCE_EVENT: ${{ github.event_name }}
      run: bash .github/scripts/validate-release-request.sh

    - name: Bind source and canonical manifest
      id: source
      shell: bash
      env:
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$version" | sha256sum)
        {
          echo "source-sha=$SOURCE_SHA"
          echo "version=$version"
          echo "manifest-digest=${digest%% *}"
        } >> "$GITHUB_OUTPUT"

    - name: Build unsigned Windows artifacts
      id: build
      uses: ./.github/actions/build-windows-legacy
      with:
        source-sha: ${{ steps.source.outputs.source-sha }}
        version: ${{ steps.source.outputs.version }}
        manifest-digest: ${{ steps.source.outputs.manifest-digest }}

  sign:
    needs: [build, inspect]
    if: ${{ always() && !cancelled() && ((github.workflow_ref == format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.signpath_test || inputs.signpath_release_dry_run)) || (github.workflow_ref != format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) && needs.inspect.result == 'success' && needs.inspect.outputs.state != 'complete')) }}
    runs-on: windows-2022
    timeout-minutes: 75
    environment: release
    permissions:
      actions: read
      contents: read
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    outputs:
      state: ${{ steps.inventory.outputs.state }}
      staged: ${{ steps.inventory.outputs.staged }}
      reused: ${{ steps.inventory.outputs.reused }}
      os-signed-id: ${{ steps.upload-os-signed.outputs.artifact-id }}
      os-signed-digest: ${{ steps.upload-os-signed.outputs.artifact-digest }}
      os-signed-attempt: ${{ steps.os-signed.outputs.run-attempt }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      OWNER_WORKFLOW: build-windows-legacy.yml
      PLATFORM_OWNER: build-windows-legacy.yml
      ARTIFACT_ROOT: artifacts
      PLATFORM_MANIFEST: ${{ github.workspace }}/platform-artifacts.json
      RAW_ID: ${{ inputs.raw_artifact_id }}
      RAW_DIGEST: ${{ inputs.raw_artifact_digest }}
      RAW_ATTEMPT: ${{ inputs.raw_producing_attempt }}
      SIGNING_ID: ${{ inputs.signing_input_id }}
      SIGNING_DIGEST: ${{ inputs.signing_input_digest }}
      SIGNING_ATTEMPT: ${{ inputs.signing_input_attempt }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ inputs.signpath_test && 'test-signing' || 'release-signing' }}
      SIGNPATH_TEST: ${{ inputs.signpath_test && 'true' || 'false' }}
      SIGNPATH_PRODUCTION_CERTIFICATE_SHA256: ${{ vars.SIGNPATH_PRODUCTION_CERTIFICATE_SHA256 }}
    steps:
    - name: Reject conflicting SignPath modes
      if: ${{ inputs.signpath_test && inputs.signpath_release_dry_run }}
      shell: pwsh
      run: throw "signpath_test and signpath_release_dry_run cannot both be enabled"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ github.workflow_ref != format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) }}
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable Windows source
      if: ${{ github.workflow_ref != format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) }}
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      if: ${{ github.workflow_ref != format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) }}
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      if: ${{ github.workflow_ref != format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Inspect full Windows owner
      id: inventory
      if: ${{ github.workflow_ref != format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        jq() { command jq -b "$@"; }
        export -f jq
        if [[ $GITHUB_WORKSPACE != /* ]]; then
          GITHUB_WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          export GITHUB_WORKSPACE
        fi
        report=$(mktemp)
        trap 'rm -f "$report"' EXIT
        GITHUB_OUTPUT='' bash .github/actions/stage-release/release-gate.sh inspect-owner "$SOURCE_VERSION" > "$report"
        jq -e --arg source "$SOURCE_SHA" --arg version "$SOURCE_VERSION" --arg canonical "$CANONICAL_MANIFEST_SHA256" '
          .repository == "Picocrypt-NG/Picocrypt-NG" and .source_sha == $source and .version == $version and
          .canonical_manifest_sha256 == $canonical and .owner_workflow == "build-windows-legacy.yml"
        ' "$report" >/dev/null
        state=$(jq -r '.status' "$report")
        case "$state" in
          complete) staged=true; reused=true ;;
          missing) staged=false; reused=false ;;
          partial) echo 'Windows owner is partially staged; original signed generation is required before any signing' >&2; exit 1 ;;
          *) echo 'Invalid Windows owner inspection state' >&2; exit 1 ;;
        esac
        printf 'state=%s\nstaged=%s\nreused=%s\n' "$state" "$staged" "$reused" >> "$GITHUB_OUTPUT"
    - name: Verify immutable Windows input metadata
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        jq() { command jq -b "$@"; }
        export -f jq
        [[ $RAW_ID =~ ^[1-9][0-9]*$ && $SIGNING_ID =~ ^[1-9][0-9]*$ && $RAW_ID != "$SIGNING_ID" ]]
        [[ $RAW_DIGEST =~ ^[0-9a-f]{64}$ && $SIGNING_DIGEST =~ ^[0-9a-f]{64}$ ]]
        [[ $RAW_ATTEMPT =~ ^[1-9][0-9]*$ && $SIGNING_ATTEMPT =~ ^[1-9][0-9]*$ ]]
        (( RAW_ATTEMPT <= GITHUB_RUN_ATTEMPT && SIGNING_ATTEMPT <= GITHUB_RUN_ATTEMPT ))
        PLATFORM_ARTIFACTS_JSON=$(jq -cn --arg owner "$PLATFORM_OWNER" --argjson id "$RAW_ID" --arg digest "$RAW_DIGEST" --argjson attempt "$RAW_ATTEMPT" '[{owner:$owner,arch:"amd64",id:$id,digest:$digest,attempt:$attempt}]')
        export PLATFORM_ARTIFACTS_JSON
        bash .github/actions/verify-platform-artifacts/verify-artifacts.sh metadata
        metadata=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$SIGNING_ID")
        jq -e --arg id "$SIGNING_ID" --arg digest "sha256:$SIGNING_DIGEST" --arg name "unsigned-windows-legacy-attempt-$SIGNING_ATTEMPT" --arg run "$GITHUB_RUN_ID" --arg source "$SOURCE_SHA" '
          (.id|tostring) == $id and .name == $name and .digest == $digest and .expired == false and
          (.workflow_run.id|tostring) == $run and .workflow_run.head_sha == $source
        ' <<< "$metadata" >/dev/null
        printf 'PLATFORM_ARTIFACTS_JSON=%s\n' "$PLATFORM_ARTIFACTS_JSON" >> "$GITHUB_ENV"
    - name: Download Windows validation artifact
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.raw_artifact_id }}
        path: artifacts/build-windows-legacy
        merge-multiple: true
        digest-mismatch: error
    - name: Verify Windows validation payload
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      run: |
        set -euo pipefail
        jq() { command jq -b "$@"; }
        export -f jq
        if [[ $PLATFORM_MANIFEST != /* ]]; then PLATFORM_MANIFEST=$(cygpath -u "$PLATFORM_MANIFEST"); export PLATFORM_MANIFEST; fi
        bash .github/actions/verify-platform-artifacts/verify-artifacts.sh payload
    - name: Download unsigned build artifact
      if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) || steps.inventory.outputs.state == 'missing' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ github.workflow_ref == format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) && needs.build.outputs.signing-input-id || inputs.signing_input_id }}
        path: unsigned-legacy
        merge-multiple: true
        digest-mismatch: error

    - name: Validate Windows signing carrier
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      run: |
        set -euo pipefail
        directory=unsigned-legacy
        test -d "$directory" && test ! -L "$directory"
        expected=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | awk '$2 == "build-windows-legacy.yml" {print $1}' | LC_ALL=C sort)
        test "$(find "$directory" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)" = "$expected"
        while IFS= read -r name; do
          test -f "$directory/$name" && test ! -L "$directory/$name" && test -s "$directory/$name" || exit 1
          cmp -- "$directory/$name" "$ARTIFACT_ROOT/build-windows-legacy/$name"
        done <<< "$expected"
    - name: Upload unsigned legacy CLI for SignPath
      if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) || steps.inventory.outputs.state == 'missing' }}
      id: upload-signpath-legacy
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ github.workflow_ref == format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) && 'signpath-windows-legacy' || format('signpath-windows-legacy-attempt-{0}', github.run_attempt) }}
        path: unsigned-legacy/Picocrypt-NG-cli-Legacy.exe
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

    - name: Require SignPath token
      if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) || steps.inventory.outputs.state == 'missing' }}
      shell: pwsh
      env:
        SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) { throw 'Missing SignPath API token' }
    - name: Sign legacy CLI with SignPath
      if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) || steps.inventory.outputs.state == 'missing' }}
      uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: d6e78672-6bae-47d3-b2b8-fa464705b34e
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: windows-legacy-cli
        github-artifact-id: ${{ steps.upload-signpath-legacy.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 3600
        output-artifact-directory: signpath-signed-legacy

    - name: Verify legacy Authenticode signature
      if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) || steps.inventory.outputs.state == 'missing' }}
      shell: pwsh
      run: |
        $path = "signpath-signed-legacy/Picocrypt-NG-cli-Legacy.exe"
        $signature = Get-AuthenticodeSignature -FilePath $path
        if ($null -eq $signature.SignerCertificate) {
          throw "No Authenticode signer certificate: $path"
        }
        if (@("NotSigned", "HashMismatch", "NotSupported") -contains [string]$signature.Status) {
          throw "Invalid Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
        }
        if ($env:SIGNPATH_TEST -ne "true" -and $signature.Status -ne "Valid") {
          throw "Production Authenticode signature is not trusted: $($signature.Status) $($signature.StatusMessage)"
        }
        if ($env:SIGNPATH_TEST -ne "true" -and $null -eq $signature.TimeStamperCertificate) {
          throw "Production Authenticode signature has no timestamp: $path"
        }
        if ($env:SIGNPATH_TEST -ne "true" -and $env:SIGNPATH_PRODUCTION_CERTIFICATE_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') {
          throw "SIGNPATH_PRODUCTION_CERTIFICATE_SHA256 must be the production certificate's 64-character SHA-256 fingerprint"
        }
        if ($env:SIGNPATH_TEST -ne "true") {
          $actualCertificateSHA256 = $signature.SignerCertificate.GetCertHashString(
            [System.Security.Cryptography.HashAlgorithmName]::SHA256
          )
          if ($actualCertificateSHA256 -ne $env:SIGNPATH_PRODUCTION_CERTIFICATE_SHA256) {
            throw "Unexpected production signing certificate: $actualCertificateSHA256"
          }
        }

    - name: Upload signed Windows legacy artifact
      if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) && !inputs.signpath_release_dry_run }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.signpath_test && 'signed-windows-legacy-TEST-DO-NOT-PUBLISH' || 'signed-windows-legacy' }}
        path: signpath-signed-legacy/Picocrypt-NG-cli-Legacy.exe
        if-no-files-found: error
        compression-level: 9
        retention-days: 1

    - name: Prepare OS-signed Windows carrier
      id: os-signed
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir os-signed
        cp -- "signpath-signed-legacy/Picocrypt-NG-cli-Legacy.exe" os-signed/
        echo "run-attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
    - name: Upload OS-signed Windows carrier
      id: upload-os-signed
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: os-signed-build-windows-legacy-attempt-${{ github.run_attempt }}
        path: os-signed/*
        if-no-files-found: error
        compression-level: 9
        retention-days: 7
        overwrite: false

  release:
    needs: [build, sign]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.sign.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !inputs.signpath_test && !inputs.signpath_release_dry_run && inputs.publish_release && github.workflow_ref == format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download signed artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: signed-windows-legacy
        path: artifacts/build-windows-legacy

    - name: Get version tag
      run: |
        VERSION=$(cat VERSION)
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Sign and attest artifacts
      uses: ./.github/actions/sign-and-attest
      with:
        paths: |
          artifacts/build-windows-legacy/Picocrypt-NG-cli-Legacy.exe

    - name: Generate release notes
      uses: ./.github/actions/release-body
      with:
        version: ${{ env.VERSION }}

    - name: Stage release assets
      uses: ./.github/actions/stage-release
      with:
        version: ${{ env.VERSION }}
        body_path: ${{ github.workspace }}/release-body.md
        files: |
          artifacts/build-windows-legacy/Picocrypt-NG-cli-Legacy.exe
          artifacts/build-windows-legacy/Picocrypt-NG-cli-Legacy.exe.sigstore.json

  inspect:
    if: ${{ github.workflow_ref != format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      OWNER_WORKFLOW: build-windows-legacy.yml
    outputs:
      state: ${{ steps.inventory.outputs.state }}
      staged: ${{ steps.inventory.outputs.staged }}
      reused: ${{ steps.inventory.outputs.reused }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable Windows source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Inspect full Windows owner
      id: inventory
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        report=$(mktemp)
        trap 'rm -f "$report"' EXIT
        GITHUB_OUTPUT='' bash .github/actions/stage-release/release-gate.sh inspect-owner "$SOURCE_VERSION" > "$report"
        jq -e --arg source "$SOURCE_SHA" --arg version "$SOURCE_VERSION" --arg canonical "$CANONICAL_MANIFEST_SHA256" '
          .repository == "Picocrypt-NG/Picocrypt-NG" and .source_sha == $source and .version == $version and
          .canonical_manifest_sha256 == $canonical and .owner_workflow == "build-windows-legacy.yml"
        ' "$report" >/dev/null
        state=$(jq -r '.status' "$report")
        case "$state" in
          complete) staged=true; reused=true ;;
          missing) staged=false; reused=false ;;
          partial) echo 'Windows owner is partially staged; original signed generation is required before any signing' >&2; exit 1 ;;
          *) echo 'Invalid Windows owner inspection state' >&2; exit 1 ;;
        esac
        printf 'state=%s\nstaged=%s\nreused=%s\n' "$state" "$staged" "$reused" >> "$GITHUB_OUTPUT"

  attest:
    needs: sign
    if: ${{ always() && !cancelled() && needs.sign.result == 'success' && github.workflow_ref != format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) && needs.sign.outputs.state != 'complete' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      OWNER_WORKFLOW: build-windows-legacy.yml
      GENERATION_OWNER: build-windows-legacy.yml
      GENERATION_DIR: signed-generation
      CARRIER_ID: ${{ needs.sign.outputs.os-signed-id }}
      CARRIER_DIGEST: ${{ needs.sign.outputs.os-signed-digest }}
      CARRIER_ATTEMPT: ${{ needs.sign.outputs.os-signed-attempt }}
    outputs:
      state: ${{ steps.inventory.outputs.state }}
      staged: ${{ steps.inventory.outputs.staged }}
      reused: ${{ steps.inventory.outputs.reused }}
      generation-id: ${{ steps.upload-generation.outputs.artifact-id }}
      generation-digest: ${{ steps.upload-generation.outputs.artifact-digest }}
      generation-attempt: ${{ steps.generation.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable Windows source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Inspect full Windows owner
      id: inventory
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        report=$(mktemp)
        trap 'rm -f "$report"' EXIT
        GITHUB_OUTPUT='' bash .github/actions/stage-release/release-gate.sh inspect-owner "$SOURCE_VERSION" > "$report"
        jq -e --arg source "$SOURCE_SHA" --arg version "$SOURCE_VERSION" --arg canonical "$CANONICAL_MANIFEST_SHA256" '
          .repository == "Picocrypt-NG/Picocrypt-NG" and .source_sha == $source and .version == $version and
          .canonical_manifest_sha256 == $canonical and .owner_workflow == "build-windows-legacy.yml"
        ' "$report" >/dev/null
        state=$(jq -r '.status' "$report")
        case "$state" in
          complete) staged=true; reused=true ;;
          missing) staged=false; reused=false ;;
          partial) echo 'Windows owner is partially staged; original signed generation is required before any signing' >&2; exit 1 ;;
          *) echo 'Invalid Windows owner inspection state' >&2; exit 1 ;;
        esac
        printf 'state=%s\nstaged=%s\nreused=%s\n' "$state" "$staged" "$reused" >> "$GITHUB_OUTPUT"
    - name: Verify OS-signed Windows carrier metadata
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ $CARRIER_ID =~ ^[1-9][0-9]*$ && $CARRIER_DIGEST =~ ^[0-9a-f]{64}$ && $CARRIER_ATTEMPT =~ ^[1-9][0-9]*$ ]]
        (( CARRIER_ATTEMPT <= GITHUB_RUN_ATTEMPT ))
        metadata=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$CARRIER_ID")
        jq -e --arg id "$CARRIER_ID" --arg digest "sha256:$CARRIER_DIGEST" --arg name "os-signed-build-windows-legacy-attempt-$CARRIER_ATTEMPT" --arg run "$GITHUB_RUN_ID" --arg source "$SOURCE_SHA" '
          (.id|tostring) == $id and .name == $name and .digest == $digest and .expired == false and
          (.workflow_run.id|tostring) == $run and .workflow_run.head_sha == $source
        ' <<< "$metadata" >/dev/null
    - name: Download OS-signed Windows carrier
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.sign.outputs.os-signed-id }}
        path: artifacts/build-windows-legacy
        merge-multiple: true
        digest-mismatch: error
    - name: Validate OS-signed Windows carrier payload
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      run: |
        set -euo pipefail
        directory=artifacts/build-windows-legacy
        test -d "$directory" && test ! -L "$directory"
        expected=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | awk '$2 == "build-windows-legacy.yml" {print $1}' | LC_ALL=C sort)
        test "$(find "$directory" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)" = "$expected"
        while IFS= read -r name; do
          test -f "$directory/$name" && test ! -L "$directory/$name" && test -s "$directory/$name" || exit 1
        done <<< "$expected"
    - name: Sign and attest artifacts
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: ./.github/actions/sign-and-attest
      with:
        paths: |
          artifacts/build-windows-legacy/Picocrypt-NG-cli-Legacy.exe
    - name: Record signed Windows generation
      id: generation
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash .github/actions/signed-generation/generation.sh record
    - name: Upload signed Windows generation
      id: upload-generation
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.generation.outputs.artifact-name }}
        path: signed-generation/*
        if-no-files-found: error
        compression-level: 9
        retention-days: 7
        overwrite: false

  stage:
    needs: attest
    if: ${{ always() && !cancelled() && needs.attest.result == 'success' && github.workflow_ref != format('{0}/.github/workflows/build-windows-legacy.yml@{1}', github.repository, github.ref) && needs.attest.outputs.state != 'complete' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      OWNER_WORKFLOW: build-windows-legacy.yml
      GENERATION_OWNER: build-windows-legacy.yml
      GENERATION_DIR: signed-generation
      GENERATION_ARTIFACT_ID: ${{ needs.attest.outputs.generation-id }}
      GENERATION_ARTIFACT_DIGEST: ${{ needs.attest.outputs.generation-digest }}
      GENERATION_ARTIFACT_ATTEMPT: ${{ needs.attest.outputs.generation-attempt }}
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable Windows source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Verify signed generation metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash .github/actions/signed-generation/generation.sh metadata
    - name: Download signed Windows generation
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.attest.outputs.generation-id }}
        path: signed-generation
        merge-multiple: true
        digest-mismatch: error
    - name: Restore signed Windows generation
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash .github/actions/signed-generation/generation.sh restore
    - name: Generate release notes
      uses: ./.github/actions/release-body
      with:
        version: ${{ inputs.version }}
    - name: Stage release assets
      id: stage
      uses: ./.github/actions/stage-release
      with:
        version: ${{ inputs.version }}
        body_path: ${{ github.workspace }}/release-body.md
        files: |
          artifacts/build-windows-legacy/Picocrypt-NG-cli-Legacy.exe
          artifacts/build-windows-legacy/Picocrypt-NG-cli-Legacy.exe.sigstore.json
        finalize: 'false'
