name: build-windows-legacy

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to the GitHub release. Existing assets are never overwritten."
        required: false
        type: boolean
        default: false
      signpath_test:
        description: "Submit the legacy CLI to SignPath with the self-signed test policy. Never publishes a GitHub release."
        required: false
        type: boolean
        default: false
      signpath_release_dry_run:
        description: "Validate the SignPath release policy without uploading signed output or publishing a GitHub release."
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOAMD64: v1
      GOEXPERIMENT: ""
      UPX_SHA256: eabc6792a347d45e945be7748423e7868fd01b0d2bcaa2f4b1031fd71ff69bda
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build patched Go 1.27.2 for Windows 7/8
      shell: pwsh
      run: |
        & .github/scripts/build-legacy-go.ps1 `
          -ManifestPath '.github/toolchains/legacy-go/manifest.json' `
          -OutputRoot 'C:\go-legacy'

    - name: Add go-legacy-win7 to PATH
      shell: pwsh
      run: |
        echo "C:\go-legacy\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify Go installation
      shell: pwsh
      run: |
        $expectedGo = (Resolve-Path 'C:\go-legacy\go\bin\go.exe').Path
        $actualGo = (Get-Command go -CommandType Application | Select-Object -First 1).Source
        if ($actualGo -ne $expectedGo) { throw "Unexpected go.exe: $actualGo; want $expectedGo" }
        $expectedRoot = (Resolve-Path 'C:\go-legacy\go').Path
        $goEnvironment = go env -json GOROOT GOVERSION GOTOOLCHAIN GOOS GOARCH GOAMD64 GOEXPERIMENT
        if ($LASTEXITCODE -ne 0) { throw 'Could not inspect legacy Go installation' }
        $goEnvironment = $goEnvironment | ConvertFrom-Json
        if ($goEnvironment.GOROOT -ne $expectedRoot) { throw 'Unexpected legacy GOROOT' }
        if ($goEnvironment.GOVERSION -ne 'go1.27.2') { throw 'Unexpected legacy Go version' }
        if ($goEnvironment.GOTOOLCHAIN -ne 'local') { throw 'GOTOOLCHAIN must be local' }
        if ($goEnvironment.GOOS -ne 'windows' -or $goEnvironment.GOARCH -ne 'amd64' -or
            $goEnvironment.GOAMD64 -ne 'v1' -or $goEnvironment.GOEXPERIMENT -ne '') { throw 'Unexpected legacy Go build settings' }
        go version
        if ($LASTEXITCODE -ne 0) { throw 'Legacy Go compiler failed to execute' }

    - name: Run native legacy toolchain regressions
      shell: pwsh
      run: |
        & .github/scripts/run-windows-native-tests.ps1 `
          -GoExecutable 'C:\go-legacy\go\bin\go.exe' `
          -GoArguments @('test', '-v', '-count=1', '-p', '1', '-timeout', '15m', 'os', 'internal/syscall/windows', 'crypto/internal/sysrand')
        if ($LASTEXITCODE -ne 0) { throw 'Native legacy filesystem and random-source regressions failed' }
        & .github/scripts/run-windows-native-tests.ps1 `
          -GoExecutable 'C:\go-legacy\go\bin\go.exe' `
          -GoArguments @('test', '-v', '-count=1', '-p', '1', '-timeout', '15m', '-run', '^TestReadRandomFromRtlGenRandom$', 'runtime')
        if ($LASTEXITCODE -ne 0) { throw 'Native legacy runtime random-source regression failed' }

    - name: Install dependencies
      run: |
        cd src
        go mod download

    - name: Run tests
      shell: pwsh
      run: |
        & .github/scripts/run-windows-native-tests.ps1 `
          -GoExecutable 'C:\go-legacy\go\bin\go.exe' `
          -GoArguments @('test', '-v', '-count=1', '-p', '1', '-timeout', '15m', './internal/cli', './internal/fileops', './internal/volume')
      env:
        PICOCRYPT_RUN_CLI_INTEGRATION: 1

    - name: Build CLI-only legacy binary
      run: |
        cd src
        go build -v -tags cli -ldflags="-s -w -extldflags=-static" -o Picocrypt-NG-cli-Legacy.exe ./cmd/picocrypt
      env:
        CGO_ENABLED: 1
        GOAMD64: v1

    - name: Verify legacy binary toolchain
      shell: pwsh
      run: |
        $buildInfo = go version -m src/Picocrypt-NG-cli-Legacy.exe | Out-String
        if ($LASTEXITCODE -ne 0) { throw 'Could not inspect legacy CLI build metadata' }
        if ($buildInfo -notmatch '(?m)^[^\r\n]*: go1\.27\.2\r?$') { throw 'Legacy CLI was not built by Go 1.27.2' }
        if ($buildInfo -notmatch '(?m)^\tbuild\tGOAMD64=v1\r?$') { throw 'Legacy CLI requires unsupported CPU instructions' }
        & .github/scripts/assert-windows-legacy-pe.ps1 -Path 'src/Picocrypt-NG-cli-Legacy.exe'
        $buildInfo

    - name: Compress with upx
      shell: pwsh
      run: |
        curl.exe `
          --fail `
          --location `
          --silent `
          --show-error `
          --retry 3 `
          --retry-all-errors `
          --retry-delay 2 `
          --connect-timeout 30 `
          --max-time 300 `
          --retry-max-time 600 `
          --remove-on-error `
          --output upx.zip `
          https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-win64.zip
        if ($LASTEXITCODE -ne 0) {
          throw "UPX download failed with exit code $LASTEXITCODE"
        }
        $expectedHash = $env:UPX_SHA256
        $actualHash = (Get-FileHash upx.zip -Algorithm SHA256).Hash.ToLower()
        if ($actualHash -ne $expectedHash) {
          throw "Checksum mismatch for upx.zip: expected $expectedHash, got $actualHash"
        }
        Expand-Archive -DestinationPath upx upx.zip
        upx/upx-5.2.1-win64/upx.exe --lzma src/Picocrypt-NG-cli-Legacy.exe

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unsigned-windows-legacy
        path: src/Picocrypt-NG-cli-Legacy.exe
        if-no-files-found: error
        compression-level: 9
        retention-days: 1

  sign:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.signpath_test || inputs.signpath_release_dry_run) }}
    runs-on: windows-2022
    timeout-minutes: 75
    environment: release
    permissions:
      actions: read
      contents: read
    env:
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ inputs.signpath_test && 'test-signing' || 'release-signing' }}
      SIGNPATH_TEST: ${{ inputs.signpath_test && 'true' || 'false' }}
      SIGNPATH_PRODUCTION_CERTIFICATE_SHA256: ${{ vars.SIGNPATH_PRODUCTION_CERTIFICATE_SHA256 }}
    steps:
    - name: Reject conflicting SignPath modes
      if: ${{ inputs.signpath_test && inputs.signpath_release_dry_run }}
      shell: pwsh
      run: throw "signpath_test and signpath_release_dry_run cannot both be enabled"

    - name: Download unsigned build artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: unsigned-windows-legacy
        path: unsigned-legacy

    - name: Upload unsigned legacy CLI for SignPath
      id: upload-signpath-legacy
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: signpath-windows-legacy
        path: unsigned-legacy/Picocrypt-NG-cli-Legacy.exe
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

    - name: Sign legacy CLI with SignPath
      uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: d6e78672-6bae-47d3-b2b8-fa464705b34e
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: windows-legacy-cli
        github-artifact-id: ${{ steps.upload-signpath-legacy.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 3600
        output-artifact-directory: signpath-signed-legacy

    - name: Verify legacy Authenticode signature
      shell: pwsh
      run: |
        $path = "signpath-signed-legacy/Picocrypt-NG-cli-Legacy.exe"
        $signature = Get-AuthenticodeSignature -FilePath $path
        if ($null -eq $signature.SignerCertificate) {
          throw "No Authenticode signer certificate: $path"
        }
        if (@("NotSigned", "HashMismatch", "NotSupported") -contains [string]$signature.Status) {
          throw "Invalid Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
        }
        if ($env:SIGNPATH_TEST -ne "true" -and $signature.Status -ne "Valid") {
          throw "Production Authenticode signature is not trusted: $($signature.Status) $($signature.StatusMessage)"
        }
        if ($env:SIGNPATH_TEST -ne "true" -and $null -eq $signature.TimeStamperCertificate) {
          throw "Production Authenticode signature has no timestamp: $path"
        }
        if ($env:SIGNPATH_TEST -ne "true" -and $env:SIGNPATH_PRODUCTION_CERTIFICATE_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') {
          throw "SIGNPATH_PRODUCTION_CERTIFICATE_SHA256 must be the production certificate's 64-character SHA-256 fingerprint"
        }
        if ($env:SIGNPATH_TEST -ne "true") {
          $actualCertificateSHA256 = $signature.SignerCertificate.GetCertHashString(
            [System.Security.Cryptography.HashAlgorithmName]::SHA256
          )
          if ($actualCertificateSHA256 -ne $env:SIGNPATH_PRODUCTION_CERTIFICATE_SHA256) {
            throw "Unexpected production signing certificate: $actualCertificateSHA256"
          }
        }

    - name: Upload signed Windows legacy artifact
      if: ${{ !inputs.signpath_release_dry_run }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.signpath_test && 'signed-windows-legacy-TEST-DO-NOT-PUBLISH' || 'signed-windows-legacy' }}
        path: signpath-signed-legacy/Picocrypt-NG-cli-Legacy.exe
        if-no-files-found: error
        compression-level: 9
        retention-days: 1

  release:
    needs: [build, sign]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !inputs.signpath_test && !inputs.signpath_release_dry_run && inputs.publish_release }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download signed artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: signed-windows-legacy
        path: artifacts/build-windows-legacy

    - name: Get version tag
      run: |
        VERSION=$(cat VERSION)
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Sign and attest artifacts
      uses: ./.github/actions/sign-and-attest
      with:
        paths: |
          artifacts/build-windows-legacy/Picocrypt-NG-cli-Legacy.exe

    - name: Generate release notes
      uses: ./.github/actions/release-body
      with:
        version: ${{ env.VERSION }}

    - name: Stage release assets
      uses: ./.github/actions/stage-release
      with:
        version: ${{ env.VERSION }}
        body_path: ${{ github.workspace }}/release-body.md
        files: |
          artifacts/build-windows-legacy/Picocrypt-NG-cli-Legacy.exe
          artifacts/build-windows-legacy/Picocrypt-NG-cli-Legacy.exe.sigstore.json
