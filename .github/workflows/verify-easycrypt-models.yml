name: verify-easycrypt-models

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'android/**'
      - 'dist/**'
      - 'fastlane/**'
      - 'images/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-source-contract:
    name: Go source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27.3"
        cache: false

    - name: Fetch pinned source-contract dependencies
      working-directory: verification/gobra
      run: go mod download

    - name: Prepare actual production package metadata
      working-directory: src
      env:
        GOTOOLCHAIN: local
        GOWORK: "off"
        GOENV: "off"
        GOFLAGS: ""
        GOPACKAGESDRIVER: "off"
        GOOS: linux
        GOARCH: amd64
        CGO_ENABLED: "0"
      run: go list -mod=readonly -deps -export ./internal/util ./internal/pcv3operation/internal/pcv3 > /dev/null

    - name: Fetch pinned Gobra image
      run: docker pull ghcr.io/viperproject/gobra@sha256:775879e8483561186291653d4c8a818c222eafd38f4b50a42d4b8873eebc9481

    - name: Check current source contract and overflow control
      run: sh verification/gobra/check.sh

    - name: Retain source-contract evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gobra-source-evidence-${{ github.sha }}
        path: |
          verification/gobra/_build/results.json
          verification/gobra/_build/runs/**/*.log
          verification/gobra/_build/runs/**/results.json
        if-no-files-found: warn

  model-proofs:
    name: EasyCrypt model proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install native proof-tool prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ make patch pkg-config libgmp-dev libmpfr-dev libpcre2-dev zlib1g-dev unzip bubblewrap

    - name: Bind proof-toolchain cache identity
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      id: toolchain-cache
      shell: bash
      run: |
        cache_host=$(printf '%s\0' "${ImageOS:?}" "${ImageVersion:?}" "$HOME" "$GITHUB_WORKSPACE" | sha256sum)
        echo "host=${cache_host%% *}" >> "$GITHUB_OUTPUT"

    - name: Set up cached OCaml toolchain
      uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
      with:
        ocaml-compiler: "5.4.0"
        opam-pin: false
        cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        dune-cache: false
        cache-prefix: pcng-easycrypt-v1-${{ steps.toolchain-cache.outputs.host }}-${{ hashFiles('verification/easycrypt/toolchain.json', 'verification/easycrypt/toolchain.export', 'verification/easycrypt/bootstrap.py', 'verification/easycrypt/cache.py', 'verification/easycrypt/run.py', 'verification/easycrypt/policy.py', 'verification/easycrypt/tests/*.py', '.github/workflows/verify-easycrypt-models.yml') }}

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.5"
        enable-cache: false

    - name: Verify cached EasyCrypt files
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: uv run --no-project python verification/easycrypt/cache.py check

    - name: Install frozen EasyCrypt toolchain
      run: uv run --no-project python verification/easycrypt/bootstrap.py

    - name: Check proof-admission policy
      run: uv run --no-project python -m unittest discover -s verification/easycrypt/tests -v

    - name: Check models and defect controls
      run: uv run --no-project python verification/easycrypt/run.py

    - name: Record installed EasyCrypt files
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
        opam clean --all-switches --download-cache --logs --repo-cache --untracked --unused-repositories
        uv run --no-project python verification/easycrypt/cache.py record

    - name: Retain model-check evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: easycrypt-model-evidence-${{ github.sha }}
        path: |
          verification/easycrypt/_build/results.json
          verification/easycrypt/_build/runs/**/*.log
          verification/easycrypt/_build/runs/**/results.json
        if-no-files-found: warn
