name: release-coordinator

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate by default; stage or publish only with separately authorized production execution."
        required: false
        type: choice
        options:
          - validation
          - stage
          - publish
        default: validation

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      version: ${{ steps.source.outputs.version }}
      manifest-digest: ${{ steps.source.outputs.manifest-digest }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Bind source and canonical manifest
      id: source
      shell: bash
      env:
        SOURCE_SHA: ${{ github.sha }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        case "$MODE" in
          validation) ;;
          stage|publish)
            test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
            test "$GITHUB_WORKFLOW_SHA" = "$SOURCE_SHA"
            ;;
          *) echo 'Unsupported coordinator mode' >&2; exit 2 ;;
        esac
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$version" | sha256sum)
        {
          echo "source-sha=$SOURCE_SHA"
          echo "version=$version"
          echo "manifest-digest=${digest%% *}"
        } >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native Linux artifacts
      id: build
      uses: ./.github/actions/build-linux
      with:
        arch: amd64
        upx_pkg: upx-5.2.1-amd64_linux
        upx_sha256: 402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657
        gui_binary: Picocrypt-NG
        cli_binary: Picocrypt-NG-cli
        build_deb: "true"
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native Linux artifacts
      id: build
      uses: ./.github/actions/build-linux
      with:
        arch: arm64
        upx_pkg: upx-5.2.1-arm64_linux
        upx_sha256: a72d112c5970a904a31da0b9c84f919bc16b9a311787c12245508544a78c7d36
        gui_binary: Picocrypt-NG-arm64
        cli_binary: Picocrypt-NG-cli-arm64
        build_deb: "false"
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}

  build-appimage:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
      signing-input-id: ${{ steps.build.outputs.signing-input-id }}
      signing-input-digest: ${{ steps.build.outputs.signing-input-digest }}
      signing-input-attempt: ${{ steps.build.outputs.signing-input-attempt }}
      signing-input-sha256: ${{ steps.build.outputs.signing-input-sha256 }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native AppImage validation artifacts
      id: build
      uses: ./.github/actions/build-appimage
      with:
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}
        retain-signing-input: ${{ inputs.mode != 'validation' }}

  build-snapcraft:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native Snap validation artifacts
      id: build
      uses: ./.github/actions/build-snapcraft
      with:
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}

  build-macos:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      CGO_CFLAGS: "-mmacosx-version-min=15.0"
      CGO_LDFLAGS: "-mmacosx-version-min=15.0"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native macOS validation artifacts
      id: build
      uses: ./.github/actions/build-macos
      with:
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}

  build-android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
      signing-input-id: ${{ steps.build.outputs.signing-input-id }}
      signing-input-digest: ${{ steps.build.outputs.signing-input-digest }}
      signing-input-attempt: ${{ steps.build.outputs.signing-input-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native Android validation artifacts
      id: build
      uses: ./.github/actions/build-android
      with:
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}

  build-windows:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
      signing-input-id: ${{ steps.build.outputs.signing-input-id }}
      signing-input-digest: ${{ steps.build.outputs.signing-input-digest }}
      signing-input-attempt: ${{ steps.build.outputs.signing-input-attempt }}
    env:
      RESHACKER_SHA256: b611be2f35cb44efd1c29df03e7ebe62bd556a500585680e1afa5e073eaf1756
      UPX_SHA256: eabc6792a347d45e945be7748423e7868fd01b0d2bcaa2f4b1031fd71ff69bda
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native Windows current validation artifacts
      id: build
      uses: ./.github/actions/build-windows
      with:
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}

  build-windows-legacy:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
      signing-input-id: ${{ steps.build.outputs.signing-input-id }}
      signing-input-digest: ${{ steps.build.outputs.signing-input-digest }}
      signing-input-attempt: ${{ steps.build.outputs.signing-input-attempt }}
    env:
      GOTOOLCHAIN: local
      GOAMD64: v1
      GOEXPERIMENT: ""
      UPX_SHA256: eabc6792a347d45e945be7748423e7868fd01b0d2bcaa2f4b1031fd71ff69bda
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build native Windows legacy validation artifacts
      id: build
      uses: ./.github/actions/build-windows-legacy
      with:
        source-sha: ${{ needs.prepare.outputs.source-sha }}
        version: ${{ needs.prepare.outputs.version }}
        manifest-digest: ${{ needs.prepare.outputs.manifest-digest }}

  verify-linux:
    needs: [prepare, build-amd64, build-arm64]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      run-attempt: ${{ steps.report.outputs.run-attempt }}
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
      SOURCE_VERSION: ${{ needs.prepare.outputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-digest }}
      AMD64_ARTIFACT_ID: ${{ needs.build-amd64.outputs.artifact-id }}
      AMD64_ARTIFACT_DIGEST: ${{ needs.build-amd64.outputs.artifact-digest }}
      AMD64_RUN_ATTEMPT: ${{ needs.build-amd64.outputs.run-attempt }}
      ARM64_ARTIFACT_ID: ${{ needs.build-arm64.outputs.artifact-id }}
      ARM64_ARTIFACT_DIGEST: ${{ needs.build-arm64.outputs.artifact-digest }}
      ARM64_RUN_ATTEMPT: ${{ needs.build-arm64.outputs.run-attempt }}
      ARTIFACT_ROOT: artifacts
      LINUX_MANIFEST: ${{ github.workspace }}/linux-artifacts.json
    steps:
    - name: Require both Linux producers
      shell: bash
      env:
        AMD64_RESULT: ${{ needs.build-amd64.result }}
        ARM64_RESULT: ${{ needs.build-arm64.result }}
      run: |
        set -euo pipefail
        [[ "$AMD64_RESULT" == success && "$ARM64_RESULT" == success ]]

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh

    - name: Verify immutable Linux artifact metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/build-linux/verify-artifacts.sh metadata

    - name: Download Linux AMD64 artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-amd64.outputs.artifact-id }}
        path: artifacts/build-linux-amd64
        merge-multiple: true
        digest-mismatch: error

    - name: Download Linux ARM64 artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-arm64.outputs.artifact-id }}
        path: artifacts/build-linux-arm64
        merge-multiple: true
        digest-mismatch: error

    - name: Verify Linux payload manifests
      shell: bash
      run: bash .github/actions/build-linux/verify-artifacts.sh payload

    - name: Record verified Linux file inventory
      id: report
      shell: bash
      run: |
        set -euo pipefail
        files=$(jq -nc --slurpfile amd64 "$ARTIFACT_ROOT/build-linux-amd64/payload-manifest.json" \
          --slurpfile arm64 "$ARTIFACT_ROOT/build-linux-arm64/payload-manifest.json" \
          '[$amd64[0].files[] | {name,sha256,owner:"build-linux.yml",path:("artifacts/build-linux-amd64/" + .name)}]
            + [$arm64[0].files[] | {name,sha256,owner:"build-linux.yml",path:("artifacts/build-linux-arm64/" + .name)}] | sort_by(.name)')
        jq -e 'length == 5 and ([.[].name]|unique|length) == 5' <<< "$files" >/dev/null
        temporary=$(mktemp "$LINUX_MANIFEST.XXXXXX")
        trap 'rm -f -- "$temporary"' EXIT
        jq --argjson files "$files" '. + {files:$files}' "$LINUX_MANIFEST" > "$temporary"
        mv -- "$temporary" "$LINUX_MANIFEST"
        echo "run-attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

    - name: Upload Linux verification manifest
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux-validation-attempt-${{ github.run_attempt }}
        path: ${{ env.LINUX_MANIFEST }}
        if-no-files-found: error
        retention-days: 7
        overwrite: false

    - name: Report Linux validation scope
      shell: bash
      run: |
        echo 'Linux primary assets: built 5, verified 5; production signing not requested.' >> "$GITHUB_STEP_SUMMARY"
        echo 'The complete 19-asset result is reported by the final validation gate.' >> "$GITHUB_STEP_SUMMARY"

  verify-platforms:
    needs: [prepare, build-appimage, build-snapcraft, build-macos, build-android, build-windows, build-windows-legacy]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      run-attempt: ${{ steps.payload.outputs.run-attempt }}
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
      SOURCE_VERSION: ${{ needs.prepare.outputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-digest }}
      ARTIFACT_ROOT: artifacts
      PLATFORM_MANIFEST: ${{ github.workspace }}/platform-artifacts.json
      PLATFORM_ARTIFACTS_JSON: >-
        [
          {"owner":"build-appimage.yml","arch":"amd64","id":${{ needs.build-appimage.outputs.artifact-id }},"digest":"${{ needs.build-appimage.outputs.artifact-digest }}","attempt":${{ needs.build-appimage.outputs.run-attempt }}},
          {"owner":"build-snapcraft.yml","arch":"amd64","id":${{ needs.build-snapcraft.outputs.artifact-id }},"digest":"${{ needs.build-snapcraft.outputs.artifact-digest }}","attempt":${{ needs.build-snapcraft.outputs.run-attempt }}},
          {"owner":"build-macos.yml","arch":"arm64","id":${{ needs.build-macos.outputs.artifact-id }},"digest":"${{ needs.build-macos.outputs.artifact-digest }}","attempt":${{ needs.build-macos.outputs.run-attempt }}},
          {"owner":"build-android.yml","arch":"all","id":${{ needs.build-android.outputs.artifact-id }},"digest":"${{ needs.build-android.outputs.artifact-digest }}","attempt":${{ needs.build-android.outputs.run-attempt }}},
          {"owner":"build-windows.yml","arch":"amd64","id":${{ needs.build-windows.outputs.artifact-id }},"digest":"${{ needs.build-windows.outputs.artifact-digest }}","attempt":${{ needs.build-windows.outputs.run-attempt }}},
          {"owner":"build-windows-legacy.yml","arch":"amd64","id":${{ needs.build-windows-legacy.outputs.artifact-id }},"digest":"${{ needs.build-windows-legacy.outputs.artifact-digest }}","attempt":${{ needs.build-windows-legacy.outputs.run-attempt }}}
        ]
    steps:
    - name: Require all platform producers
      shell: bash
      env:
        PREPARE_RESULT: ${{ needs.prepare.result }}
        APPIMAGE_RESULT: ${{ needs.build-appimage.result }}
        SNAP_RESULT: ${{ needs.build-snapcraft.result }}
        MACOS_RESULT: ${{ needs.build-macos.result }}
        ANDROID_RESULT: ${{ needs.build-android.result }}
        WINDOWS_RESULT: ${{ needs.build-windows.result }}
        LEGACY_RESULT: ${{ needs.build-windows-legacy.result }}
      run: |
        set -euo pipefail
        [[ "$PREPARE_RESULT" == success && "$APPIMAGE_RESULT" == success && "$SNAP_RESULT" == success &&
           "$MACOS_RESULT" == success && "$ANDROID_RESULT" == success && "$WINDOWS_RESULT" == success && "$LEGACY_RESULT" == success ]]

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh

    - name: Verify immutable platform artifact metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/verify-platform-artifacts/verify-artifacts.sh metadata

    - name: Download AppImage artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-appimage.outputs.artifact-id }}
        path: artifacts/build-appimage
        merge-multiple: true
        digest-mismatch: error

    - name: Download Snap artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-snapcraft.outputs.artifact-id }}
        path: artifacts/build-snapcraft
        merge-multiple: true
        digest-mismatch: error

    - name: Download macOS artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-macos.outputs.artifact-id }}
        path: artifacts/build-macos
        merge-multiple: true
        digest-mismatch: error

    - name: Download Android artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-android.outputs.artifact-id }}
        path: artifacts/build-android
        merge-multiple: true
        digest-mismatch: error

    - name: Download Windows current artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-windows.outputs.artifact-id }}
        path: artifacts/build-windows
        merge-multiple: true
        digest-mismatch: error

    - name: Download Windows legacy artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build-windows-legacy.outputs.artifact-id }}
        path: artifacts/build-windows-legacy
        merge-multiple: true
        digest-mismatch: error

    - name: Verify platform payload manifests
      id: payload
      shell: bash
      run: |
        set -euo pipefail
        bash .github/actions/verify-platform-artifacts/verify-artifacts.sh payload
        echo "run-attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

    - name: Upload platform verification manifest
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: platform-validation-attempt-${{ github.run_attempt }}
        path: ${{ env.PLATFORM_MANIFEST }}
        if-no-files-found: error
        retention-days: 7
        overwrite: false

  validation:
    needs: [prepare, verify-linux, verify-platforms]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
      SOURCE_VERSION: ${{ needs.prepare.outputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-digest }}
      LINUX_REPORT_ID: ${{ needs.verify-linux.outputs.artifact-id }}
      LINUX_REPORT_DIGEST: ${{ needs.verify-linux.outputs.artifact-digest }}
      LINUX_REPORT_ATTEMPT: ${{ needs.verify-linux.outputs.run-attempt }}
      PLATFORM_REPORT_ID: ${{ needs.verify-platforms.outputs.artifact-id }}
      PLATFORM_REPORT_DIGEST: ${{ needs.verify-platforms.outputs.artifact-digest }}
      PLATFORM_REPORT_ATTEMPT: ${{ needs.verify-platforms.outputs.run-attempt }}
      LINUX_REPORT: verification/linux/linux-artifacts.json
      PLATFORM_REPORT: verification/platforms/platform-artifacts.json
      VALIDATION_MANIFEST: ${{ github.workspace }}/validation-artifacts.json
    steps:
    - name: Require both artifact verifiers
      shell: bash
      env:
        PREPARE_RESULT: ${{ needs.prepare.result }}
        LINUX_RESULT: ${{ needs.verify-linux.result }}
        PLATFORM_RESULT: ${{ needs.verify-platforms.result }}
      run: |
        set -euo pipefail
        [[ "$PREPARE_RESULT" == success && "$LINUX_RESULT" == success && "$PLATFORM_RESULT" == success ]]
        [[ $LINUX_REPORT_ID =~ ^[1-9][0-9]*$ && $PLATFORM_REPORT_ID =~ ^[1-9][0-9]*$ && $LINUX_REPORT_ID != "$PLATFORM_REPORT_ID" ]]
        [[ $LINUX_REPORT_DIGEST =~ ^[0-9a-f]{64}$ && $PLATFORM_REPORT_DIGEST =~ ^[0-9a-f]{64}$ ]]
        [[ $LINUX_REPORT_ATTEMPT =~ ^[1-9][0-9]*$ && $PLATFORM_REPORT_ATTEMPT =~ ^[1-9][0-9]*$ ]]
        (( LINUX_REPORT_ATTEMPT <= GITHUB_RUN_ATTEMPT && PLATFORM_REPORT_ATTEMPT <= GITHUB_RUN_ATTEMPT ))

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh

    - name: Verify immutable verifier report metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        for kind in linux platforms; do
          if [[ $kind == linux ]]; then
            id=$LINUX_REPORT_ID digest=$LINUX_REPORT_DIGEST attempt=$LINUX_REPORT_ATTEMPT
            name="linux-validation-attempt-$attempt"
          else
            id=$PLATFORM_REPORT_ID digest=$PLATFORM_REPORT_DIGEST attempt=$PLATFORM_REPORT_ATTEMPT
            name="platform-validation-attempt-$attempt"
          fi
          metadata=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")
          jq -e --argjson id "$id" --arg digest "sha256:$digest" --arg name "$name" \
            --argjson run "$GITHUB_RUN_ID" --arg source "$SOURCE_SHA" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false
              and .workflow_run.id == $run and .workflow_run.head_sha == $source' <<< "$metadata" >/dev/null
        done

    - name: Download linux verification report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.verify-linux.outputs.artifact-id }}
        path: verification/linux
        merge-multiple: true
        digest-mismatch: error

    - name: Download platforms verification report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.verify-platforms.outputs.artifact-id }}
        path: verification/platforms
        merge-multiple: true
        digest-mismatch: error

    - name: Join complete validation manifest
      shell: bash
      run: |
        set -euo pipefail
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(cat VERSION)" = "$SOURCE_VERSION"
        canonical=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION")
        actual=$(printf '%s\n' "$canonical" | sha256sum)
        test "${actual%% *}" = "$CANONICAL_MANIFEST_SHA256"
        for kind in linux platforms; do
          if [[ $kind == linux ]]; then
            report=$LINUX_REPORT count=5
          else
            report=$PLATFORM_REPORT count=14
          fi
          test -f "$report" && test ! -L "$report" && test -s "$report" || exit 1
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg source "$SOURCE_SHA" --arg version "$SOURCE_VERSION" \
            --arg canonical "$CANONICAL_MANIFEST_SHA256" --arg run "$GITHUB_RUN_ID" --argjson count "$count" \
            'type == "object" and keys == ["artifacts","canonical_manifest_sha256","files","repository","run_id","schema_version","source_sha","version"]
              and .schema_version == 1 and .repository == $repository and .source_sha == $source and .version == $version
              and .canonical_manifest_sha256 == $canonical and .run_id == $run
              and (.files|type == "array" and length == $count)
              and all(.files[]; type == "object" and keys == ["name","owner","path","sha256"]
                and (.name|type == "string") and (.owner|type == "string") and (.path|type == "string")
                and (.sha256|type == "string" and test("^[0-9a-f]{64}$")))' "$report" >/dev/null
        done
        files=$(jq -nc --slurpfile linux "$LINUX_REPORT" --slurpfile platforms "$PLATFORM_REPORT" \
            '$linux[0].files + $platforms[0].files | sort_by(.name)')
        jq -e 'length == 19 and ([.[].name]|unique|length) == 19' <<< "$files" >/dev/null
        expected=$(awk '{path=$3; if ($2 != "build-linux.yml") path="artifacts/" substr($2,1,length($2)-4) "/" $1; print $1 "\t" $2 "\t" path}' <<< "$canonical" | LC_ALL=C sort)
        actual=$(jq -r '.[] | [.name,.owner,.path] | @tsv' <<< "$files" | LC_ALL=C sort)
        test "$actual" = "$expected"
        temporary=$(mktemp "$VALIDATION_MANIFEST.XXXXXX")
        trap 'rm -f -- "$temporary"' EXIT
        jq -nS --arg repository "$GITHUB_REPOSITORY" --arg source_sha "$SOURCE_SHA" --arg version "$SOURCE_VERSION" \
            --arg canonical_manifest_sha256 "$CANONICAL_MANIFEST_SHA256" --arg run_id "$GITHUB_RUN_ID" \
            --argjson linux_id "$LINUX_REPORT_ID" --arg linux_digest "$LINUX_REPORT_DIGEST" --argjson linux_attempt "$LINUX_REPORT_ATTEMPT" \
            --argjson platform_id "$PLATFORM_REPORT_ID" --arg platform_digest "$PLATFORM_REPORT_DIGEST" --argjson platform_attempt "$PLATFORM_REPORT_ATTEMPT" \
            --argjson files "$files" \
            '{schema_version:1,repository:$repository,source_sha:$source_sha,version:$version,
            canonical_manifest_sha256:$canonical_manifest_sha256,run_id:$run_id,mode:"validation",
            publish_release:false,production_signing:"not-requested",
            macos_signing:"ad-hoc bundle seal only; no Developer ID or notarization",
            verification_reports:{linux:{id:$linux_id,digest:$linux_digest,run_attempt:$linux_attempt},
              platforms:{id:$platform_id,digest:$platform_digest,run_attempt:$platform_attempt}},files:$files}' > "$temporary"
        mv -- "$temporary" "$VALIDATION_MANIFEST"

    - name: Upload complete validation manifest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: full-validation-attempt-${{ github.run_attempt }}
        path: ${{ env.VALIDATION_MANIFEST }}
        if-no-files-found: error
        retention-days: 7
        overwrite: false

    - name: Report complete validation scope
      shell: bash
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
        Full validation: 19 canonical primary assets built and verified.
        This report covers only the validation phase. Production effects require the separately selected stage/publish mode.
        macOS packaging retains its ad-hoc bundle seal; this is not Developer ID signing or notarization.
        EOF

  owner-linux:
    needs: [prepare, validation, build-amd64, build-arm64]
    if: ${{ !cancelled() && inputs.mode != 'validation' && needs.validation.result == 'success' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-linux.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source-sha }}
      version: ${{ needs.prepare.outputs.version }}
      canonical_manifest_sha256: ${{ needs.prepare.outputs.manifest-digest }}
      amd64_artifact_id: ${{ needs.build-amd64.outputs.artifact-id }}
      amd64_artifact_digest: ${{ needs.build-amd64.outputs.artifact-digest }}
      amd64_producing_attempt: ${{ needs.build-amd64.outputs.run-attempt }}
      arm64_artifact_id: ${{ needs.build-arm64.outputs.artifact-id }}
      arm64_artifact_digest: ${{ needs.build-arm64.outputs.artifact-digest }}
      arm64_producing_attempt: ${{ needs.build-arm64.outputs.run-attempt }}

  owner-macos:
    needs: [prepare, validation, build-macos]
    if: ${{ !cancelled() && inputs.mode != 'validation' && needs.validation.result == 'success' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-macos.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source-sha }}
      version: ${{ needs.prepare.outputs.version }}
      canonical_manifest_sha256: ${{ needs.prepare.outputs.manifest-digest }}
      raw_artifact_id: ${{ needs.build-macos.outputs.artifact-id }}
      raw_artifact_digest: ${{ needs.build-macos.outputs.artifact-digest }}
      raw_producing_attempt: ${{ needs.build-macos.outputs.run-attempt }}

  owner-snapcraft:
    needs: [prepare, validation, build-snapcraft]
    if: ${{ !cancelled() && inputs.mode != 'validation' && needs.validation.result == 'success' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-snapcraft.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source-sha }}
      version: ${{ needs.prepare.outputs.version }}
      canonical_manifest_sha256: ${{ needs.prepare.outputs.manifest-digest }}
      raw_artifact_id: ${{ needs.build-snapcraft.outputs.artifact-id }}
      raw_artifact_digest: ${{ needs.build-snapcraft.outputs.artifact-digest }}
      raw_producing_attempt: ${{ needs.build-snapcraft.outputs.run-attempt }}

  owner-android:
    needs: [prepare, validation, build-android]
    if: ${{ !cancelled() && inputs.mode != 'validation' && needs.validation.result == 'success' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-android.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source-sha }}
      version: ${{ needs.prepare.outputs.version }}
      canonical_manifest_sha256: ${{ needs.prepare.outputs.manifest-digest }}
      raw_artifact_id: ${{ needs.build-android.outputs.artifact-id }}
      raw_artifact_digest: ${{ needs.build-android.outputs.artifact-digest }}
      raw_producing_attempt: ${{ needs.build-android.outputs.run-attempt }}
      signing_input_id: ${{ needs.build-android.outputs.signing-input-id }}
      signing_input_digest: ${{ needs.build-android.outputs.signing-input-digest }}
      signing_input_attempt: ${{ needs.build-android.outputs.signing-input-attempt }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  owner-windows:
    needs: [prepare, validation, build-windows]
    if: ${{ !cancelled() && inputs.mode != 'validation' && needs.validation.result == 'success' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-windows.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source-sha }}
      version: ${{ needs.prepare.outputs.version }}
      canonical_manifest_sha256: ${{ needs.prepare.outputs.manifest-digest }}
      raw_artifact_id: ${{ needs.build-windows.outputs.artifact-id }}
      raw_artifact_digest: ${{ needs.build-windows.outputs.artifact-digest }}
      raw_producing_attempt: ${{ needs.build-windows.outputs.run-attempt }}
      signing_input_id: ${{ needs.build-windows.outputs.signing-input-id }}
      signing_input_digest: ${{ needs.build-windows.outputs.signing-input-digest }}
      signing_input_attempt: ${{ needs.build-windows.outputs.signing-input-attempt }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  owner-windows-legacy:
    needs: [prepare, validation, build-windows-legacy]
    if: ${{ !cancelled() && inputs.mode != 'validation' && needs.validation.result == 'success' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-windows-legacy.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source-sha }}
      version: ${{ needs.prepare.outputs.version }}
      canonical_manifest_sha256: ${{ needs.prepare.outputs.manifest-digest }}
      raw_artifact_id: ${{ needs.build-windows-legacy.outputs.artifact-id }}
      raw_artifact_digest: ${{ needs.build-windows-legacy.outputs.artifact-digest }}
      raw_producing_attempt: ${{ needs.build-windows-legacy.outputs.run-attempt }}
      signing_input_id: ${{ needs.build-windows-legacy.outputs.signing-input-id }}
      signing_input_digest: ${{ needs.build-windows-legacy.outputs.signing-input-digest }}
      signing_input_attempt: ${{ needs.build-windows-legacy.outputs.signing-input-attempt }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  owner-appimage:
    needs: [prepare, validation, build-appimage]
    if: ${{ !cancelled() && inputs.mode != 'validation' && needs.validation.result == 'success' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-appimage.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source-sha }}
      version: ${{ needs.prepare.outputs.version }}
      canonical_manifest_sha256: ${{ needs.prepare.outputs.manifest-digest }}
      raw_artifact_id: ${{ needs.build-appimage.outputs.artifact-id }}
      raw_artifact_digest: ${{ needs.build-appimage.outputs.artifact-digest }}
      raw_producing_attempt: ${{ needs.build-appimage.outputs.run-attempt }}
      signing_input_id: ${{ needs.build-appimage.outputs.signing-input-id }}
      signing_input_digest: ${{ needs.build-appimage.outputs.signing-input-digest }}
      signing_input_attempt: ${{ needs.build-appimage.outputs.signing-input-attempt }}
      signing_input_sha256: ${{ needs.build-appimage.outputs.signing-input-sha256 }}
    secrets:
      APPIMAGE_GPG_PRIVATE_KEY: ${{ secrets.APPIMAGE_GPG_PRIVATE_KEY }}
      APPIMAGE_GPG_PASSPHRASE: ${{ secrets.APPIMAGE_GPG_PASSPHRASE }}

  publish:
    needs: [prepare, owner-linux, owner-macos, owner-snapcraft, owner-android, owner-windows, owner-windows-legacy, owner-appimage]
    if: ${{ always() && !cancelled() && inputs.mode == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    outputs:
      published: ${{ steps.finalize.outputs.published }}
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_VERSION: ${{ needs.prepare.outputs.version }}
      BODY_PATH: ${{ github.workspace }}/release-body.md
      MODE: ${{ inputs.mode }}
      OWNER_RESULTS_JSON: >-
        [{"owner":"build-linux.yml","result":"${{ needs.owner-linux.result }}","staged":"${{ needs.owner-linux.outputs.staged }}"},{"owner":"build-macos.yml","result":"${{ needs.owner-macos.result }}","staged":"${{ needs.owner-macos.outputs.staged }}"},{"owner":"build-snapcraft.yml","result":"${{ needs.owner-snapcraft.result }}","staged":"${{ needs.owner-snapcraft.outputs.staged }}"},{"owner":"build-android.yml","result":"${{ needs.owner-android.result }}","staged":"${{ needs.owner-android.outputs.staged }}"},{"owner":"build-windows.yml","result":"${{ needs.owner-windows.result }}","staged":"${{ needs.owner-windows.outputs.staged }}"},{"owner":"build-windows-legacy.yml","result":"${{ needs.owner-windows-legacy.result }}","staged":"${{ needs.owner-windows-legacy.outputs.staged }}"},{"owner":"build-appimage.yml","result":"${{ needs.owner-appimage.result }}","staged":"${{ needs.owner-appimage.outputs.staged }}"}]
    steps:
    - name: Require every staged owner
      shell: bash
      run: |
        set -euo pipefail
        test "$MODE" = publish
        jq -e 'type == "array" and length == 7
          and ([.[].owner]|sort) == ["build-android.yml","build-appimage.yml","build-linux.yml","build-macos.yml","build-snapcraft.yml","build-windows-legacy.yml","build-windows.yml"]
          and all(.[]; .result == "success" and .staged == "true")' <<< "$OWNER_RESULTS_JSON" >/dev/null

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh

    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v3.1.3

    - name: Generate release notes
      uses: ./.github/actions/release-body
      with:
        version: ${{ needs.prepare.outputs.version }}

    - name: Strictly finalize complete release
      id: finalize
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/stage-release/release-gate.sh strict-finalize "$SOURCE_VERSION"

    - name: Require confirmed publication
      shell: bash
      env:
        PUBLISHED: ${{ steps.finalize.outputs.published }}
      run: test "$PUBLISHED" = true

  result:
    needs: [prepare, build-amd64, build-arm64, build-appimage, build-snapcraft, build-macos, build-android, build-windows, build-windows-legacy, verify-linux, verify-platforms, validation, owner-linux, owner-macos, owner-snapcraft, owner-android, owner-windows, owner-windows-legacy, owner-appimage, publish]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MODE: ${{ inputs.mode }}
      VALIDATION_RESULT: ${{ needs.validation.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      PUBLISHED: ${{ needs.publish.outputs.published }}
      OWNER_RESULTS_JSON: >-
        [
          {"owner":"build-linux.yml","built_results":["${{ needs.build-amd64.result }}","${{ needs.build-arm64.result }}"],"verify_result":"${{ needs.verify-linux.result }}","result":"${{ needs.owner-linux.result }}","reused":"${{ needs.owner-linux.outputs.reused }}","staged":"${{ needs.owner-linux.outputs.staged }}","generation_id":"${{ needs.owner-linux.outputs.generation_id }}","generation_digest":"${{ needs.owner-linux.outputs.generation_digest }}","generation_attempt":"${{ needs.owner-linux.outputs.generation_attempt }}"},
          {"owner":"build-macos.yml","built_results":["${{ needs.build-macos.result }}"],"verify_result":"${{ needs.verify-platforms.result }}","result":"${{ needs.owner-macos.result }}","reused":"${{ needs.owner-macos.outputs.reused }}","staged":"${{ needs.owner-macos.outputs.staged }}","generation_id":"${{ needs.owner-macos.outputs.generation_id }}","generation_digest":"${{ needs.owner-macos.outputs.generation_digest }}","generation_attempt":"${{ needs.owner-macos.outputs.generation_attempt }}"},
          {"owner":"build-snapcraft.yml","built_results":["${{ needs.build-snapcraft.result }}"],"verify_result":"${{ needs.verify-platforms.result }}","result":"${{ needs.owner-snapcraft.result }}","reused":"${{ needs.owner-snapcraft.outputs.reused }}","staged":"${{ needs.owner-snapcraft.outputs.staged }}","generation_id":"${{ needs.owner-snapcraft.outputs.generation_id }}","generation_digest":"${{ needs.owner-snapcraft.outputs.generation_digest }}","generation_attempt":"${{ needs.owner-snapcraft.outputs.generation_attempt }}"},
          {"owner":"build-android.yml","built_results":["${{ needs.build-android.result }}"],"verify_result":"${{ needs.verify-platforms.result }}","result":"${{ needs.owner-android.result }}","reused":"${{ needs.owner-android.outputs.reused }}","staged":"${{ needs.owner-android.outputs.staged }}","generation_id":"${{ needs.owner-android.outputs.generation_id }}","generation_digest":"${{ needs.owner-android.outputs.generation_digest }}","generation_attempt":"${{ needs.owner-android.outputs.generation_attempt }}"},
          {"owner":"build-windows.yml","built_results":["${{ needs.build-windows.result }}"],"verify_result":"${{ needs.verify-platforms.result }}","result":"${{ needs.owner-windows.result }}","reused":"${{ needs.owner-windows.outputs.reused }}","staged":"${{ needs.owner-windows.outputs.staged }}","generation_id":"${{ needs.owner-windows.outputs.generation_id }}","generation_digest":"${{ needs.owner-windows.outputs.generation_digest }}","generation_attempt":"${{ needs.owner-windows.outputs.generation_attempt }}"},
          {"owner":"build-windows-legacy.yml","built_results":["${{ needs.build-windows-legacy.result }}"],"verify_result":"${{ needs.verify-platforms.result }}","result":"${{ needs.owner-windows-legacy.result }}","reused":"${{ needs.owner-windows-legacy.outputs.reused }}","staged":"${{ needs.owner-windows-legacy.outputs.staged }}","generation_id":"${{ needs.owner-windows-legacy.outputs.generation_id }}","generation_digest":"${{ needs.owner-windows-legacy.outputs.generation_digest }}","generation_attempt":"${{ needs.owner-windows-legacy.outputs.generation_attempt }}"},
          {"owner":"build-appimage.yml","built_results":["${{ needs.build-appimage.result }}"],"verify_result":"${{ needs.verify-platforms.result }}","result":"${{ needs.owner-appimage.result }}","reused":"${{ needs.owner-appimage.outputs.reused }}","staged":"${{ needs.owner-appimage.outputs.staged }}","generation_id":"${{ needs.owner-appimage.outputs.generation_id }}","generation_digest":"${{ needs.owner-appimage.outputs.generation_digest }}","generation_attempt":"${{ needs.owner-appimage.outputs.generation_attempt }}"}
        ]
    steps:
    - name: Summarize and require requested outcome
      shell: bash
      run: |
        set -euo pipefail
        summary=$(jq -cn --arg mode "$MODE" --arg validation "$VALIDATION_RESULT" --arg publish_result "$PUBLISH_RESULT" --arg published "$PUBLISHED" --arg attempt "$GITHUB_RUN_ATTEMPT" --argjson owners "$OWNER_RESULTS_JSON" '
          ($publish_result == "success" and $published == "true") as $is_published |
          ($owners | map({
            owner,
            result,
            built:all(.built_results[]; . == "success"),
            verified:(.verify_result == "success"),
            signed:(.reused != "true" and .generation_attempt == $attempt and (.generation_id|test("^[1-9][0-9]*$")) and (.generation_digest|test("^[0-9a-f]{64}$"))),
            reused:(.result == "success" and .reused == "true"),
            staged:(.result == "success" and .staged == "true"),
            published:($is_published and .result == "success" and .staged == "true")
          })) as $rows |
          {mode:$mode,published:$is_published,owners:$rows,success:(
            $validation == "success" and ($owners|length) == 7 and
            ([$owners[].owner]|sort) == ["build-android.yml","build-appimage.yml","build-linux.yml","build-macos.yml","build-snapcraft.yml","build-windows-legacy.yml","build-windows.yml"] and
            (if $mode == "validation" then $publish_result == "skipped" and all($owners[]; .result == "skipped")
             elif $mode == "stage" then $publish_result == "skipped" and ($is_published|not) and all($rows[]; .result == "success" and .staged)
             elif $mode == "publish" then $is_published and all($rows[]; .result == "success" and .staged)
             else false end))}')
        {
          printf '## Requested mode: %s\n\n' "$MODE"
          echo '| Owner | Result | Built | Verified | Freshly signed | Reused | Staged | Published |'
          echo '|---|---|---|---|---|---|---|---|'
          jq -r '.owners[] | "| \(.owner) | \(.result) | \(.built) | \(.verified) | \(.signed) | \(.reused) | \(.staged) | \(.published) |"' <<< "$summary"
          echo
          echo 'Freshly signed requires a real generation tuple produced in this attempt; remote reuse and retained earlier generations do not claim new signing.'
          echo 'macOS retains its native ad-hoc seal; no Developer ID signing or notarization is claimed.'
        } >> "$GITHUB_STEP_SUMMARY"
        jq -e '.success == true' <<< "$summary" >/dev/null
