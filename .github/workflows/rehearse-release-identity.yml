name: rehearse-release-identity

on:
  push:
    branches: [ci/rehearse-release-identity]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct:
    if: github.repository == 'Picocrypt-NG/Picocrypt-NG'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned gh
        run: bash .github/scripts/rehearse-release-identity.sh install-gh
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Prepare fixed probe
        run: bash .github/scripts/rehearse-release-identity.sh prepare direct
      - name: Observe selected OIDC claims
        run: bash .github/scripts/rehearse-release-identity.sh observe-oidc direct
      - name: Attest probe
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rehearsal-release-identity/direct/probe.txt
      - name: Sign public probe with ephemeral identity
        run: bash .github/scripts/rehearse-release-identity.sh sign direct
      - name: Verify identity and rejection controls
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: bash .github/scripts/rehearse-release-identity.sh verify direct
      - name: Retain public rehearsal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identity-rehearsal-direct-${{ github.run_id }}-${{ github.run_attempt }}
          path: rehearsal-release-identity/direct/
          if-no-files-found: error
          retention-days: 14
  reusable:
    if: github.repository == 'Picocrypt-NG/Picocrypt-NG'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/rehearse-release-identity-leaf.yml
