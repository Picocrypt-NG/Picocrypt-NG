name: build-appimage

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Request production GPG signing and release staging. False validates unsigned packaging without release secrets."
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      canonical_manifest_sha256:
        required: true
        type: string
      raw_artifact_id:
        required: true
        type: string
      raw_artifact_digest:
        required: true
        type: string
      raw_producing_attempt:
        required: true
        type: string
      signing_input_id:
        required: true
        type: string
      signing_input_digest:
        required: true
        type: string
      signing_input_attempt:
        required: true
        type: string
      signing_input_sha256:
        required: true
        type: string
    secrets:
      APPIMAGE_GPG_PRIVATE_KEY:
        required: true
      APPIMAGE_GPG_PASSPHRASE:
        required: true
    outputs:
      staged:
        description: True after verified full-owner reuse or stage-only upload.
        value: ${{ jobs.inspect.outputs.staged == 'true' && 'true' || jobs.sign.outputs.staged == 'true' && 'true' || jobs.attest.outputs.staged == 'true' && 'true' || jobs.stage.outputs.staged }}
      reused:
        description: Whether fresh full-owner inspection reused existing signed pairs.
        value: ${{ jobs.inspect.outputs.reused == 'true' || jobs.sign.outputs.reused == 'true' || jobs.attest.outputs.reused == 'true' }}
      generation_id:
        description: Exact immutable full signed generation ID, when produced.
        value: ${{ jobs.attest.outputs.generation-id }}
      generation_digest:
        description: Official ZIP digest of that signed generation.
        value: ${{ jobs.attest.outputs.generation-digest }}
      generation_attempt:
        description: Producing attempt of that retained generation.
        value: ${{ jobs.attest.outputs.generation-attempt }}

concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref) }}
    # ubuntu-22.04 (glibc 2.35) is the portability floor. AppImage was dropped once
    # "for better portability" (Changelog v1.34); building on the newest runner's glibc
    # forward-binds symbols that fail on older distros and would reproduce that. GL and
    # GPU-driver libraries are intentionally NOT bundled (linuxdeploy excludelist) -- they
    # are provided by the host, which is what keeps the AppImage portable (incl. Nvidia).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      signing-input-id: ${{ steps.build.outputs.signing-input-id }}
      signing-input-sha256: ${{ steps.build.outputs.signing-input-sha256 }}
      signing-input-digest: ${{ steps.build.outputs.signing-input-digest }}
      signing-input-attempt: ${{ steps.build.outputs.signing-input-attempt }}
    steps:
    - name: Validate AppImage dispatch inputs
      shell: bash
      env:
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
        SOURCE_EVENT: ${{ github.event_name }}
        SOURCE_REF: ${{ github.ref }}
      run: |
        case "$PUBLISH_RELEASE" in
          true|false) ;;
          *) echo "::error::publish_release must be a boolean"; exit 2 ;;
        esac
        if [[ $PUBLISH_RELEASE == true && ( $SOURCE_EVENT != workflow_dispatch || $SOURCE_REF != refs/heads/main ) ]]; then
          echo "::error::Production signing requires a main-branch workflow dispatch"
          exit 2
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Bind AppImage source and canonical manifest
      id: source
      shell: bash
      env:
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$version" | sha256sum)
        {
          echo "source-sha=$SOURCE_SHA"
          echo "version=$version"
          echo "manifest-digest=${digest%% *}"
        } >> "$GITHUB_OUTPUT"

    - name: Build unsigned AppImage artifacts
      id: build
      uses: ./.github/actions/build-appimage
      with:
        retain-signing-input: ${{ inputs.publish_release }}
        source-sha: ${{ steps.source.outputs.source-sha }}
        version: ${{ steps.source.outputs.version }}
        manifest-digest: ${{ steps.source.outputs.manifest-digest }}

  inspect:
    if: ${{ ! (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      OWNER_WORKFLOW: build-appimage.yml
    outputs:
      state: ${{ steps.inventory.outputs.state }}
      staged: ${{ steps.inventory.outputs.staged }}
      reused: ${{ steps.inventory.outputs.reused }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable AppImage source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Inspect full AppImage owner
      id: inventory
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        report=$(mktemp)
        trap 'rm -f "$report"' EXIT
        GITHUB_OUTPUT='' bash .github/actions/stage-release/release-gate.sh inspect-owner "$SOURCE_VERSION" > "$report"
        jq -e --arg source "$SOURCE_SHA" --arg version "$SOURCE_VERSION" --arg canonical "$CANONICAL_MANIFEST_SHA256" '
          .repository == "Picocrypt-NG/Picocrypt-NG" and .source_sha == $source and .version == $version and
          .canonical_manifest_sha256 == $canonical and .owner_workflow == "build-appimage.yml"
        ' "$report" >/dev/null
        state=$(jq -r '.status' "$report")
        case "$state" in
          complete) staged=true; reused=true ;;
          missing) staged=false; reused=false ;;
          partial) echo 'AppImage owner is partially staged; original signed generation is required before any signing' >&2; exit 1 ;;
          *) echo 'Invalid AppImage owner inspection state' >&2; exit 1 ;;
        esac
        printf 'state=%s\nstaged=%s\nreused=%s\n' "$state" "$staged" "$reused" >> "$GITHUB_OUTPUT"

  sign:
    needs: [build, inspect]
    if: ${{ always() && !cancelled() && ((github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref) && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release && needs.build.result == 'success') || (! (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) && needs.inspect.result == 'success' && needs.inspect.outputs.state != 'complete')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      OWNER_WORKFLOW: build-appimage.yml
      PLATFORM_OWNER: build-appimage.yml
      PLATFORM_ARTIFACTS_JSON: '[{"owner":"build-appimage.yml","arch":"amd64","id":${{ inputs.raw_artifact_id }},"digest":"${{ inputs.raw_artifact_digest }}","attempt":${{ inputs.raw_producing_attempt }}}]'
      ARTIFACT_ROOT: artifacts
      PLATFORM_MANIFEST: ${{ github.workspace }}/appimage-artifacts.json
    outputs:
      artifact-id: ${{ steps.upload-signed.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-signed.outputs.artifact-digest }}
      run-attempt: ${{ github.run_attempt }}
      state: ${{ steps.inventory.outputs.state }}
      staged: ${{ steps.inventory.outputs.staged }}
      reused: ${{ steps.inventory.outputs.reused }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Validate reusable AppImage source
      if: ${{ ! (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) }}
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      if: ${{ ! (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Inspect full AppImage owner
      if: ${{ ! (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) }}
      id: inventory
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        report=$(mktemp)
        trap 'rm -f "$report"' EXIT
        GITHUB_OUTPUT='' bash .github/actions/stage-release/release-gate.sh inspect-owner "$SOURCE_VERSION" > "$report"
        jq -e --arg source "$SOURCE_SHA" --arg version "$SOURCE_VERSION" --arg canonical "$CANONICAL_MANIFEST_SHA256" '
          .repository == "Picocrypt-NG/Picocrypt-NG" and .source_sha == $source and .version == $version and
          .canonical_manifest_sha256 == $canonical and .owner_workflow == "build-appimage.yml"
        ' "$report" >/dev/null
        state=$(jq -r '.status' "$report")
        case "$state" in
          complete) staged=true; reused=true ;;
          missing) staged=false; reused=false ;;
          partial) echo 'AppImage owner is partially staged; original signed generation is required before any signing' >&2; exit 1 ;;
          *) echo 'Invalid AppImage owner inspection state' >&2; exit 1 ;;
        esac
        printf 'state=%s\nstaged=%s\nreused=%s\n' "$state" "$staged" "$reused" >> "$GITHUB_OUTPUT"
    - name: Verify immutable AppImage raw metadata
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/verify-platform-artifacts/verify-artifacts.sh metadata
    - name: Download AppImage raw artifact
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.raw_artifact_id }}
        path: artifacts/build-appimage
        merge-multiple: true
        digest-mismatch: error
    - name: Verify AppImage raw payload
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      run: bash .github/actions/verify-platform-artifacts/verify-artifacts.sh payload
    - name: Verify AppImage signing-input metadata
      if: ${{ (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) || steps.inventory.outputs.state == 'missing' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CARRIER_ID: ${{ inputs.signing_input_id || needs.build.outputs.signing-input-id }}
        CARRIER_DIGEST: ${{ inputs.signing_input_digest || needs.build.outputs.signing-input-digest }}
        CARRIER_ATTEMPT: ${{ inputs.signing_input_attempt || needs.build.outputs.signing-input-attempt }}
      run: |
        set -euo pipefail
        [[ $CARRIER_ID =~ ^[1-9][0-9]*$ && $CARRIER_DIGEST =~ ^[0-9a-f]{64}$ && $CARRIER_ATTEMPT =~ ^[1-9][0-9]*$ ]]
        (( CARRIER_ATTEMPT <= GITHUB_RUN_ATTEMPT ))
        metadata=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$CARRIER_ID")
        jq -e --arg id "$CARRIER_ID" --arg name "appimage-signing-input-attempt-$CARRIER_ATTEMPT" --arg digest "sha256:$CARRIER_DIGEST" \
          --arg run "$GITHUB_RUN_ID" --arg source "$GITHUB_SHA" '
          (.id|tostring) == $id and .name == $name and .digest == $digest and .expired == false
            and (.workflow_run.id|tostring) == $run and .workflow_run.head_sha == $source
          ' <<< "$metadata" >/dev/null
    - name: Download same-run signing input
      if: ${{ (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) || steps.inventory.outputs.state == 'missing' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.signing_input_id || needs.build.outputs.signing-input-id }}
        path: signing-input
        merge-multiple: true
        digest-mismatch: error

    - name: Check and extract signing input
      if: ${{ (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) || steps.inventory.outputs.state == 'missing' }}
      env:
        EXPECTED_SHA256: ${{ inputs.signing_input_sha256 || needs.build.outputs.signing-input-sha256 }}
      run: |
        [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
        cd signing-input
        echo "$EXPECTED_SHA256  AppDir.tar" | sha256sum --check --strict --status
        cd ..
        python3 .github/scripts/extract-appimage-appdir.py signing-input/AppDir.tar signing-work

    - name: Install packaging dependencies
      if: ${{ (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) || steps.inventory.outputs.state == 'missing' }}
      run: |
        sudo apt update
        sudo apt install -y curl jq desktop-file-utils file gnupg

    - name: Fetch and verify AppImage tooling
      if: ${{ (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) || steps.inventory.outputs.state == 'missing' }}
      run: |
        mkdir .appimage-tools
        bash .github/scripts/install-appimage-build-tools.sh .appimage-tools

    - name: Import GPG signing key
      if: ${{ (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) || steps.inventory.outputs.state == 'missing' }}
      env:
        GPG_PRIVATE_KEY: ${{ secrets.APPIMAGE_GPG_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        test -n "$GPG_PRIVATE_KEY" || { echo "::error::APPIMAGE_GPG_PRIVATE_KEY secret is empty"; exit 1; }
        SIGN_KEY=$(jq -er '.expected_fingerprint' .github/toolchains/appimage-verifier/manifest.json)
        [[ "$SIGN_KEY" =~ ^[0-9A-F]{40}$ ]] || exit 1
        GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/appimage-signing.XXXXXXXX")
        chmod 700 "$GNUPGHOME"
        export GNUPGHOME
        echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
        printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
        printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
        ACTUAL=$(gpg --batch --with-colons --list-secret-keys "$SIGN_KEY" | awk -F: '$1 == "sec" { primary=1; next } primary && $1 == "fpr" { print $10; primary=0 }')
        test "$ACTUAL" = "$SIGN_KEY" || { echo "::error::expected release signing key is unavailable"; exit 1; }
        echo "SIGN_KEY=$SIGN_KEY" >> "$GITHUB_ENV"

    - name: Build signed AppImage
      if: ${{ (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) || steps.inventory.outputs.state == 'missing' }}
      env:
        APPIMAGE_EXTRACT_AND_RUN: "1"
        APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.APPIMAGE_GPG_PASSPHRASE }}
      run: |
        VERSION=$(cat VERSION)
        OUTPUT="Picocrypt-NG-${VERSION}-x86_64.AppImage"
        UPDATE_INFORMATION="gh-releases-zsync|${GITHUB_REPOSITORY%/*}|${GITHUB_REPOSITORY#*/}|latest|Picocrypt-NG-*-x86_64.AppImage.zsync"
        export VERSION
        ARCH=x86_64 ./.appimage-tools/appimagetool \
          --runtime-file .appimage-tools/runtime --updateinformation "$UPDATE_INFORMATION" \
          --sign --sign-key "$SIGN_KEY" signing-work/AppDir "$OUTPUT"
        test -f "$OUTPUT"
        test -s "${OUTPUT}.zsync"

    - name: Remove production signing key
      if: ${{ always() }}
      run: |
        if [[ -n "${GNUPGHOME:-}" ]]; then
          trap 'rm -rf -- "$GNUPGHOME"' EXIT
          gpgconf --kill gpg-agent
        fi

    - name: Verify AppImage signature
      if: ${{ (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) || steps.inventory.outputs.state == 'missing' }}
      run: |
        VERSION=$(cat VERSION)
        APP="Picocrypt-NG-${VERSION}-x86_64.AppImage"
        bash .github/scripts/verify-appimage.sh "$APP"

    - name: Smoke test AppImage
      if: ${{ (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) || steps.inventory.outputs.state == 'missing' }}
      env:
        APPIMAGE_EXTRACT_AND_RUN: "1"
      run: |
        VERSION=$(cat VERSION)
        APP="Picocrypt-NG-${VERSION}-x86_64.AppImage"
        out=$("./$APP" --version)
        echo "$out"
        echo "$out" | grep -qi picocrypt

    - name: Upload signed artifacts
      id: upload-signed
      if: ${{ (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) || steps.inventory.outputs.state == 'missing' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: signed-appimage-attempt-${{ github.run_attempt }}
        path: |
          Picocrypt-NG-*-x86_64.AppImage
          Picocrypt-NG-*-x86_64.AppImage.zsync
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
        overwrite: false

  release:
    needs: sign
    if: ${{ !cancelled() && needs.sign.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release && github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.sign.outputs.artifact-id }}
        path: artifacts
        merge-multiple: true
        digest-mismatch: error

    - name: Get version tag
      run: |
        VERSION=$(cat VERSION)
        APP="Picocrypt-NG-${VERSION}-x86_64.AppImage"
        {
          echo "VERSION=$VERSION"
          echo "APPIMAGE_NAME=$APP"
        } >> "$GITHUB_ENV"

    - name: Sign and attest artifacts
      uses: ./.github/actions/sign-and-attest
      with:
        paths: |
          artifacts/${{ env.APPIMAGE_NAME }}
          artifacts/${{ env.APPIMAGE_NAME }}.zsync

    - name: Generate release notes
      uses: ./.github/actions/release-body
      with:
        version: ${{ env.VERSION }}

    - name: Stage release assets
      uses: ./.github/actions/stage-release
      with:
        version: ${{ env.VERSION }}
        body_path: ${{ github.workspace }}/release-body.md
        # The .zsync must ship alongside the AppImage: AppImageUpdate fetches it from the
        # same release to compute deltas. Without it the embedded update info is a dead end.
        files: |
          artifacts/Picocrypt-NG-${{ env.VERSION }}-x86_64.AppImage
          artifacts/Picocrypt-NG-${{ env.VERSION }}-x86_64.AppImage.sigstore.json
          artifacts/Picocrypt-NG-${{ env.VERSION }}-x86_64.AppImage.zsync
          artifacts/Picocrypt-NG-${{ env.VERSION }}-x86_64.AppImage.zsync.sigstore.json

  attest:
    needs: sign
    if: ${{ !cancelled() && needs.sign.result == 'success' && ! (github.workflow_ref == format('{0}/.github/workflows/build-appimage.yml@{1}', github.repository, github.ref)) && needs.sign.outputs.state == 'missing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      OWNER_WORKFLOW: build-appimage.yml
      GENERATION_OWNER: build-appimage.yml
      GENERATION_DIR: signed-generation
    outputs:
      state: ${{ steps.inventory.outputs.state }}
      staged: ${{ steps.inventory.outputs.staged }}
      reused: ${{ steps.inventory.outputs.reused }}
      generation-id: ${{ steps.upload-generation.outputs.artifact-id }}
      generation-digest: ${{ steps.upload-generation.outputs.artifact-digest }}
      generation-attempt: ${{ steps.generation.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable AppImage source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Inspect full AppImage owner
      id: inventory
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        report=$(mktemp)
        trap 'rm -f "$report"' EXIT
        GITHUB_OUTPUT='' bash .github/actions/stage-release/release-gate.sh inspect-owner "$SOURCE_VERSION" > "$report"
        jq -e --arg source "$SOURCE_SHA" --arg version "$SOURCE_VERSION" --arg canonical "$CANONICAL_MANIFEST_SHA256" '
          .repository == "Picocrypt-NG/Picocrypt-NG" and .source_sha == $source and .version == $version and
          .canonical_manifest_sha256 == $canonical and .owner_workflow == "build-appimage.yml"
        ' "$report" >/dev/null
        state=$(jq -r '.status' "$report")
        case "$state" in
          complete) staged=true; reused=true ;;
          missing) staged=false; reused=false ;;
          partial) echo 'AppImage owner is partially staged; original signed generation is required before any signing' >&2; exit 1 ;;
          *) echo 'Invalid AppImage owner inspection state' >&2; exit 1 ;;
        esac
        printf 'state=%s\nstaged=%s\nreused=%s\n' "$state" "$staged" "$reused" >> "$GITHUB_OUTPUT"
    - name: Verify signed AppImage carrier metadata
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CARRIER_ID: ${{ needs.sign.outputs.artifact-id }}
        CARRIER_DIGEST: ${{ needs.sign.outputs.artifact-digest }}
        CARRIER_ATTEMPT: ${{ needs.sign.outputs.run-attempt }}
      run: |
        set -euo pipefail
        [[ $CARRIER_ID =~ ^[1-9][0-9]*$ && $CARRIER_DIGEST =~ ^[0-9a-f]{64}$ && $CARRIER_ATTEMPT =~ ^[1-9][0-9]*$ ]]
        (( CARRIER_ATTEMPT <= GITHUB_RUN_ATTEMPT ))
        metadata=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$CARRIER_ID")
        jq -e --arg id "$CARRIER_ID" --arg name "signed-appimage-attempt-$CARRIER_ATTEMPT" --arg digest "sha256:$CARRIER_DIGEST" \
          --arg run "$GITHUB_RUN_ID" --arg source "$GITHUB_SHA" '
          (.id|tostring) == $id and .name == $name and .digest == $digest and .expired == false
            and (.workflow_run.id|tostring) == $run and .workflow_run.head_sha == $source
          ' <<< "$metadata" >/dev/null
    - name: Download verified signed AppImage
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.sign.outputs.artifact-id }}
        path: artifacts
        merge-multiple: true
        digest-mismatch: error
    - name: Sign and attest artifacts
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: ./.github/actions/sign-and-attest
      with:
        paths: |
          artifacts/Picocrypt-NG-${{ inputs.version }}-x86_64.AppImage
          artifacts/Picocrypt-NG-${{ inputs.version }}-x86_64.AppImage.zsync
    - name: Record signed AppImage generation
      id: generation
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/signed-generation/generation.sh record
    - name: Upload signed AppImage generation
      id: upload-generation
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.generation.outputs.artifact-name }}
        path: signed-generation/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
        overwrite: false

  stage:
    needs: attest
    if: ${{ !cancelled() && needs.attest.result == 'success' && needs.attest.outputs.state != 'complete' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      GENERATION_OWNER: build-appimage.yml
      GENERATION_DIR: signed-generation
      GENERATION_ARTIFACT_ID: ${{ needs.attest.outputs.generation-id }}
      GENERATION_ARTIFACT_DIGEST: ${{ needs.attest.outputs.generation-digest }}
      GENERATION_ARTIFACT_ATTEMPT: ${{ needs.attest.outputs.generation-attempt }}
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable AppImage source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Verify signed generation metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/signed-generation/generation.sh metadata
    - name: Download signed AppImage generation
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.attest.outputs.generation-id }}
        path: signed-generation
        merge-multiple: true
        digest-mismatch: error
    - name: Restore signed AppImage generation
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/signed-generation/generation.sh restore
    - name: Generate release notes
      uses: ./.github/actions/release-body
      with:
        version: ${{ inputs.version }}
    - name: Stage release assets
      id: stage
      uses: ./.github/actions/stage-release
      with:
        version: ${{ inputs.version }}
        body_path: ${{ github.workspace }}/release-body.md
        files: |
          artifacts/Picocrypt-NG-${{ inputs.version }}-x86_64.AppImage
          artifacts/Picocrypt-NG-${{ inputs.version }}-x86_64.AppImage.sigstore.json
          artifacts/Picocrypt-NG-${{ inputs.version }}-x86_64.AppImage.zsync
          artifacts/Picocrypt-NG-${{ inputs.version }}-x86_64.AppImage.zsync.sigstore.json
        finalize: 'false'
