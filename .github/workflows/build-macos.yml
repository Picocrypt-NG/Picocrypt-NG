name: build-macos

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to the GitHub release. Existing assets are never overwritten."
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      canonical_manifest_sha256:
        required: true
        type: string
      raw_artifact_id:
        required: true
        type: string
      raw_artifact_digest:
        required: true
        type: string
      raw_producing_attempt:
        required: true
        type: string
    outputs:
      staged:
        description: True only after full remote reuse or successful stage-only upload.
        value: ${{ jobs.inspect.outputs.staged == 'true' && 'true' || jobs.attest.outputs.staged == 'true' && 'true' || jobs.stage.outputs.staged }}
      reused:
        description: Whether a fresh full remote owner set was reused.
        value: ${{ jobs.inspect.outputs.reused == 'true' || jobs.attest.outputs.reused == 'true' }}
      generation_id:
        description: Exact immutable full signed generation ID, when one was produced.
        value: ${{ jobs.attest.outputs.generation-id }}
      generation_digest:
        description: Official digest of that exact signed generation ZIP.
        value: ${{ jobs.attest.outputs.generation-digest }}
      generation_attempt:
        description: Producing attempt of the retained signed generation.
        value: ${{ jobs.attest.outputs.generation-attempt }}

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.workflow_ref == format('{0}/.github/workflows/build-macos.yml@{1}', github.repository, github.ref) }}
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      CGO_CFLAGS: "-mmacosx-version-min=15.0"
      CGO_LDFLAGS: "-mmacosx-version-min=15.0"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate release request
      shell: bash
      env:
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
        SIGNPATH_TEST: "false"
        SIGNPATH_RELEASE_DRY_RUN: "false"
        SOURCE_REF: ${{ github.ref }}
        SOURCE_EVENT: ${{ github.event_name }}
      run: bash .github/scripts/validate-release-request.sh

    - name: Bind macOS source and canonical manifest
      id: source
      shell: bash
      env:
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$version" | shasum -a 256)
        {
          echo "source-sha=$SOURCE_SHA"
          echo "version=$version"
          echo "manifest-digest=${digest%% *}"
        } >> "$GITHUB_OUTPUT"

    - name: Build macOS artifacts
      id: build
      uses: ./.github/actions/build-macos
      with:
        source-sha: ${{ steps.source.outputs.source-sha }}
        version: ${{ steps.source.outputs.version }}
        manifest-digest: ${{ steps.source.outputs.manifest-digest }}

  release:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release && github.workflow_ref == format('{0}/.github/workflows/build-macos.yml@{1}', github.repository, github.ref) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build.outputs.artifact-id }}
        path: artifacts/build-macos
        merge-multiple: true
        digest-mismatch: error

    - name: Get version tag
      run: |
        VERSION=$(cat VERSION)
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Verify artifacts present
      run: |
        set -euo pipefail
        test -s artifacts/build-macos/Picocrypt-NG.dmg
        test -s artifacts/build-macos/Picocrypt-NG-cli-macos

    - name: Sign and attest artifacts
      uses: ./.github/actions/sign-and-attest
      with:
        paths: |
          artifacts/build-macos/Picocrypt-NG.dmg
          artifacts/build-macos/Picocrypt-NG-cli-macos

    - name: Generate release notes
      uses: ./.github/actions/release-body
      with:
        version: ${{ env.VERSION }}

    - name: Stage release assets
      uses: ./.github/actions/stage-release
      with:
        version: ${{ env.VERSION }}
        body_path: ${{ github.workspace }}/release-body.md
        files: |
          artifacts/build-macos/Picocrypt-NG.dmg
          artifacts/build-macos/Picocrypt-NG.dmg.sigstore.json
          artifacts/build-macos/Picocrypt-NG-cli-macos
          artifacts/build-macos/Picocrypt-NG-cli-macos.sigstore.json

  inspect:
    if: ${{ github.workflow_ref != format('{0}/.github/workflows/build-macos.yml@{1}', github.repository, github.ref) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      OWNER_WORKFLOW: build-macos.yml
    outputs:
      state: ${{ steps.inventory.outputs.state }}
      staged: ${{ steps.inventory.outputs.staged }}
      reused: ${{ steps.inventory.outputs.reused }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable macOS source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v3.1.3
    - name: Inspect full macOS owner
      id: inventory
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        report=$(mktemp)
        trap 'rm -f "$report"' EXIT
        GITHUB_OUTPUT='' bash .github/actions/stage-release/release-gate.sh inspect-owner "$SOURCE_VERSION" > "$report"
        jq -e --arg source "$SOURCE_SHA" --arg version "$SOURCE_VERSION" --arg canonical "$CANONICAL_MANIFEST_SHA256" '
          .repository == "Picocrypt-NG/Picocrypt-NG" and .source_sha == $source and .version == $version and
          .canonical_manifest_sha256 == $canonical and .owner_workflow == "build-macos.yml"
        ' "$report" >/dev/null
        state=$(jq -r '.status' "$report")
        case "$state" in
          complete) staged=true; reused=true ;;
          missing) staged=false; reused=false ;;
          partial) echo 'macOS owner is partially staged; original signed generation is required before any signing' >&2; exit 1 ;;
          *) echo 'Invalid macOS owner inspection state' >&2; exit 1 ;;
        esac
        printf 'state=%s\nstaged=%s\nreused=%s\n' "$state" "$staged" "$reused" >> "$GITHUB_OUTPUT"
  attest:
    needs: inspect
    if: ${{ needs.inspect.outputs.state != 'complete' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      OWNER_WORKFLOW: build-macos.yml
      PLATFORM_OWNER: build-macos.yml
      ARTIFACT_ROOT: artifacts
      PLATFORM_MANIFEST: ${{ github.workspace }}/raw-owner-artifacts.json
      GENERATION_OWNER: build-macos.yml
      GENERATION_DIR: signed-generation
      PLATFORM_ARTIFACTS_JSON: >-
        [{"owner":"build-macos.yml","arch":"arm64","id":${{ inputs.raw_artifact_id }},"digest":"${{ inputs.raw_artifact_digest }}","attempt":${{ inputs.raw_producing_attempt }}}]
    outputs:
      state: ${{ steps.inventory.outputs.state }}
      staged: ${{ steps.inventory.outputs.staged }}
      reused: ${{ steps.inventory.outputs.reused }}
      generation-id: ${{ steps.upload-generation.outputs.artifact-id }}
      generation-digest: ${{ steps.upload-generation.outputs.artifact-digest }}
      generation-attempt: ${{ steps.generation.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable macOS source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v3.1.3
    - name: Inspect full macOS owner
      id: inventory
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        report=$(mktemp)
        trap 'rm -f "$report"' EXIT
        GITHUB_OUTPUT='' bash .github/actions/stage-release/release-gate.sh inspect-owner "$SOURCE_VERSION" > "$report"
        jq -e --arg source "$SOURCE_SHA" --arg version "$SOURCE_VERSION" --arg canonical "$CANONICAL_MANIFEST_SHA256" '
          .repository == "Picocrypt-NG/Picocrypt-NG" and .source_sha == $source and .version == $version and
          .canonical_manifest_sha256 == $canonical and .owner_workflow == "build-macos.yml"
        ' "$report" >/dev/null
        state=$(jq -r '.status' "$report")
        case "$state" in
          complete) staged=true; reused=true ;;
          missing) staged=false; reused=false ;;
          partial) echo 'macOS owner is partially staged; original signed generation is required before any signing' >&2; exit 1 ;;
          *) echo 'Invalid macOS owner inspection state' >&2; exit 1 ;;
        esac
        printf 'state=%s\nstaged=%s\nreused=%s\n' "$state" "$staged" "$reused" >> "$GITHUB_OUTPUT"
    - name: Verify immutable macOS artifact metadata
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/verify-platform-artifacts/verify-artifacts.sh metadata
    - name: Download macOS raw artifact
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.raw_artifact_id }}
        path: artifacts/build-macos
        merge-multiple: true
        digest-mismatch: error
    - name: Verify macOS payload manifest
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      run: bash .github/actions/verify-platform-artifacts/verify-artifacts.sh payload
    - name: Sign and attest artifacts
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: ./.github/actions/sign-and-attest
      with:
        paths: |
          artifacts/build-macos/Picocrypt-NG.dmg
          artifacts/build-macos/Picocrypt-NG-cli-macos
    - name: Record signed macOS generation
      id: generation
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/signed-generation/generation.sh record
    - name: Upload signed macOS generation
      id: upload-generation
      if: ${{ steps.inventory.outputs.state == 'missing' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.generation.outputs.artifact-name }}
        path: signed-generation/*
        if-no-files-found: error
        compression-level: 9
        retention-days: 7
        overwrite: false
  stage:
    needs: attest
    if: ${{ needs.attest.outputs.state != 'complete' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    concurrency:
      group: ${{ github.repository }}-release-publication
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.version }}
      CANONICAL_MANIFEST_SHA256: ${{ inputs.canonical_manifest_sha256 }}
      GENERATION_OWNER: build-macos.yml
      GENERATION_DIR: signed-generation
      GENERATION_ARTIFACT_ID: ${{ needs.attest.outputs.generation-id }}
      GENERATION_ARTIFACT_DIGEST: ${{ needs.attest.outputs.generation-digest }}
      GENERATION_ARTIFACT_ATTEMPT: ${{ needs.attest.outputs.generation-attempt }}
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate reusable macOS source
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$GITHUB_WORKFLOW_REF" = Picocrypt-NG/Picocrypt-NG/.github/workflows/release.yml@refs/heads/main
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        version=$(cat VERSION)
        version=${version%$'\r'}
        test "$version" = "$SOURCE_VERSION"
        digest=$(bash .github/actions/stage-release/release-manifest.sh "$SOURCE_VERSION" | sha256sum)
        test "${digest%% *}" = "$CANONICAL_MANIFEST_SHA256"
    - name: Setup pinned GitHub CLI
      uses: ./.github/actions/setup-gh
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v3.1.3
    - name: Verify signed generation metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/signed-generation/generation.sh metadata
    - name: Download signed macOS generation
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.attest.outputs.generation-id }}
        path: signed-generation
        merge-multiple: true
        digest-mismatch: error
    - name: Restore signed macOS generation
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/signed-generation/generation.sh restore
    - name: Generate release notes
      uses: ./.github/actions/release-body
      with:
        version: ${{ inputs.version }}
    - name: Stage release assets
      id: stage
      uses: ./.github/actions/stage-release
      with:
        version: ${{ inputs.version }}
        body_path: ${{ github.workspace }}/release-body.md
        files: |
          artifacts/build-macos/Picocrypt-NG.dmg
          artifacts/build-macos/Picocrypt-NG.dmg.sigstore.json
          artifacts/build-macos/Picocrypt-NG-cli-macos
          artifacts/build-macos/Picocrypt-NG-cli-macos.sigstore.json
        finalize: 'false'
