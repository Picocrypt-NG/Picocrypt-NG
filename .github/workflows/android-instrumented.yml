name: android-instrumented

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Instrumented test scope
        required: true
        default: focused
        type: choice
        options:
          - focused
          - extended

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-instrumented:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27.2"
        cache-dependency-path: src/go.sum

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
        go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
        mkdir -p "$(go env GOPATH | cut -d: -f1)/pkg/gomobile"

    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: "temurin"
        java-version: "21"

    - name: Install Android SDK packages
      run: |
        NDK_VERSION="$(tr -d '\r\n' < android/ndk-version.txt)"
        if [ -z "$NDK_VERSION" ]; then
          echo "android/ndk-version.txt is empty" >&2
          exit 1
        fi
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

    - name: Cache Gradle dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          android/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Compute Android version metadata
      run: |
        VERSION=$(cat VERSION)
        IFS='.' read -r major minor patch <<< "$VERSION"
        major=${major:-0}
        minor=${minor:-0}
        patch=${patch:-0}
        VERSION_CODE=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
        echo "ORG_GRADLE_PROJECT_PICOCRYPT_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
        echo "ORG_GRADLE_PROJECT_PICOCRYPT_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

    - name: Build Go Mobile AAR
      working-directory: android
      run: |
        chmod +x build-gomobile.sh
        ./build-gomobile.sh

    - name: Make gradlew executable
      working-directory: android
      run: chmod +x gradlew

    - name: Run Unit Tests
      working-directory: android
      run: ./gradlew test

    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug

    - name: Assemble Instrumented Test APK
      working-directory: android
      run: ./gradlew :app:assembleDebugAndroidTest

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run focused instrumented tests
      env:
        PICOCRYPT_TEST_SCOPE: ${{ inputs.test_scope }}
      uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        # API 36 matches targetSdk and exercises current-runtime UI behavior plus
        # the 64-bit x86_64 gomobile/JNI library in the extended crypto scope.
        api-level: 36
        arch: x86_64
        # Keep the manual target-SDK suite within the same hosted-runner AVD
        # disk budget as the mandatory pull-request gate.
        disk-size: 2048M
        disable-animations: true
        # -memory 6144: the Argon2id KDF allocates 1 GiB per operation
        # (src/internal/crypto/kdf.go); the runner's default ~2.5 GiB emulator OOMs
        # (lowmemorykiller kills the test process) mid crypto roundtrip.
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 6144 -cores 4 -camera-back none -camera-front none
        # Single-line: the runner executes each script line in its own `sh -c`,
        # so multi-line `cd`/`if`/`fi` constructs do not persist across lines.
        working-directory: android
        script: >-
          case "$PICOCRYPT_TEST_SCOPE" in focused|extended) ;; *) echo "Unsupported test scope" >&2; exit 1 ;; esac;
          bash ../.github/scripts/run-android-device-tests.sh 36
          io.github.picocrypt_ng.picocrypt_ng.FileCopyServiceTest
          io.github.picocrypt_ng.picocrypt_ng.StagingServiceInstrumentedTest
          io.github.picocrypt_ng.picocrypt_ng.GoBridgeProgressMappingTest
          io.github.picocrypt_ng.picocrypt_ng.MainActivityUITest
          io.github.picocrypt_ng.picocrypt_ng.OperationNotificationTest
          io.github.picocrypt_ng.picocrypt_ng.ui.components.PasswordCardTest
          io.github.picocrypt_ng.picocrypt_ng.ui.components.KeyfileCardWriterPolicyTest
          io.github.picocrypt_ng.picocrypt_ng.ui.components.ProgressCardTest
          io.github.picocrypt_ng.picocrypt_ng.ui.components.DecryptOptionsCardTest
          io.github.picocrypt_ng.picocrypt_ng.ui.components.ErrorDialogTest
          io.github.picocrypt_ng.picocrypt_ng.ui.components.FileCardTest
          io.github.picocrypt_ng.picocrypt_ng.ui.components.KeyfileClearLifecycleTest
          io.github.picocrypt_ng.picocrypt_ng.ui.components.WorkButtonTest
          io.github.picocrypt_ng.picocrypt_ng.MainActivityStateTest
          ${{ inputs.test_scope == 'extended' && 'io.github.picocrypt_ng.picocrypt_ng.OperationManagerIntegrationTest' || '' }}

    - name: Upload instrumented test report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: instrumented-test-report
        path: |
          android/app/build/ci-device-tests/
          android/app/build/reports/androidTests/connected/
          android/app/build/outputs/androidTest-results/connected/
        if-no-files-found: warn

    - name: Prepare artifacts
      run: |
        mkdir -p out
        cp android/app/build/outputs/apk/debug/app-debug.apk out/Picocrypt-NG-android-debug.apk

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: android-instrumented-ONLY-FOR-TESTING
        path: out/*.apk
        if-no-files-found: error
        compression-level: 9
