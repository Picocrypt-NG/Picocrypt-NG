name: 'Sign and attest release artifacts'
description: >-
  Keyless Sigstore bundles and build provenance for the exact artifacts owned by
  the calling main-branch release workflow. Requires id-token and attestations
  write permissions.

inputs:
  paths:
    description: Newline-delimited release artifact paths (globs allowed).
    required: true

runs:
  using: 'composite'
  steps:
    - name: Validate exact release artifact ownership
      id: files
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Picocrypt-NG/Picocrypt-NG
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        version="$(<VERSION)"
        manifest="$(bash "$GITHUB_ACTION_PATH/../stage-release/release-manifest.sh" "$version")"
        files=()
        while IFS= read -r pat; do
          [ -z "$pat" ] && continue
          matches="$(compgen -G "$pat")" || { echo "::error::no release artifacts matched $pat"; exit 1; }
          while IFS= read -r file; do
            [ -f "$file" ] && [ ! -L "$file" ] && [ -s "$file" ] || exit 1
            case "$(realpath -- "$file")" in "$GITHUB_WORKSPACE"/*) ;; *) exit 1 ;; esac
            owner="$(awk -v path="$file" '$3 == path {print $2}' <<< "$manifest")"
            test -n "$owner"
            test "$WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/$owner@refs/heads/main"
            files+=("$file")
          done <<< "$matches"
        done <<< "$PATHS"
        [ "${#files[@]}" -gt 0 ] || { echo "::error::no release artifacts requested"; exit 1; }
        [ "$(printf '%s\n' "${files[@]}" | sort -u | wc -l)" -eq "${#files[@]}" ] || exit 1
        {
          echo 'paths<<RELEASE_ARTIFACT_PATHS'
          printf '%s\n' "${files[@]}"
          echo RELEASE_ARTIFACT_PATHS
        } >> "$GITHUB_OUTPUT"

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: 'v3.1.3'

    - name: Generate build-provenance attestation
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.files.outputs.paths }}

    - name: Sign artifacts (cosign sign-blob, keyless)
      shell: bash
      env:
        FILES: ${{ steps.files.outputs.paths }}
      run: |
        set -euo pipefail
        while IFS= read -r file; do
          cosign sign-blob "$file" --bundle "$file.sigstore.json" --yes
          test -s "$file.sigstore.json" || { echo "::error::empty bundle for $file"; exit 1; }
        done <<< "$FILES"

    - name: Fail-loud verify (cosign + provenance)
      shell: bash
      env:
        FILES: ${{ steps.files.outputs.paths }}
        IDENTITY: https://github.com/${{ github.workflow_ref }}
        ISSUER: https://token.actions.githubusercontent.com
        REPO: ${{ github.repository }}
        SOURCE_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        verify_provenance() {
          local file="$1" attempt
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "$file" \
              --repo "$REPO" \
              --cert-identity "$IDENTITY" \
              --cert-oidc-issuer "$ISSUER" \
              --signer-digest "$SOURCE_SHA" \
              --source-ref refs/heads/main \
              --source-digest "$SOURCE_SHA" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners; then return 0; fi
            echo "provenance verify retry $attempt for $file"; sleep 5
          done
          return 1
        }
        while IFS= read -r file; do
          cosign verify-blob "$file" \
            --bundle "$file.sigstore.json" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            --certificate-github-workflow-sha "$SOURCE_SHA" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-repository "$REPO"
          verify_provenance "$file" || { echo "::error::provenance verify failed for $file"; exit 1; }
        done <<< "$FILES"
