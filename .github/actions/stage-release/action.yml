name: Stage release artifacts
description: Upload and verify one platform lane's artifacts in a shared draft release.

inputs:
  version:
    description: Release tag from the root VERSION file.
    required: true
  body_path:
    description: Deterministically generated release notes.
    required: true
  files:
    description: Newline-delimited exact files owned by this platform lane.
    required: true

outputs:
  staged:
    description: True only after the requested lane was verified in the draft.
    value: ${{ steps.stage.outputs.staged || 'false' }}

runs:
  using: composite
  steps:
    - name: Reject unsafe existing release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        FILES: ${{ inputs.files }}
      run: bash "$GITHUB_ACTION_PATH/release-gate.sh" preflight "$VERSION"

    - name: Upload assets to draft release
      id: stage
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        BODY_PATH: ${{ inputs.body_path }}
        FILES: ${{ inputs.files }}
      run: bash "$GITHUB_ACTION_PATH/release-gate.sh" upload "$VERSION"
