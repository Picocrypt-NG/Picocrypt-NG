name: Stage and publish complete release
description: >-
  Upload one platform lane's artifacts to a shared draft release, then publish
  only when the exact cross-platform release manifest is complete.

inputs:
  version:
    description: Release tag from the root VERSION file.
    required: true
  body_path:
    description: Deterministically generated release notes.
    required: true
  files:
    description: Newline-delimited exact files owned by this platform lane.
    required: true

runs:
  using: composite
  steps:
    - name: Reject unsafe existing release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        FILES: ${{ inputs.files }}
      run: bash "$GITHUB_ACTION_PATH/release-gate.sh" preflight "$VERSION"

    - name: Upload assets to draft release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        BODY_PATH: ${{ inputs.body_path }}
        FILES: ${{ inputs.files }}
      run: bash "$GITHUB_ACTION_PATH/release-gate.sh" upload "$VERSION"

    - name: Publish only the complete release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        BODY_PATH: ${{ inputs.body_path }}
      run: bash "$GITHUB_ACTION_PATH/release-gate.sh" publish "$VERSION"
