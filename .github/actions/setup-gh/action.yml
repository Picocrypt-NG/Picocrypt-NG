name: Setup pinned GitHub CLI
description: Install the checksum-locked GitHub CLI for Linux AMD64 release verification.

runs:
  using: composite
  steps:
    - name: Install checksum-locked GitHub CLI
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -s)" = Linux
        test "$(uname -m)" = x86_64
        manifest="$GITHUB_ACTION_PATH/../../toolchains/github-cli.json"
        version=$(jq -er '.version' "$manifest")
        url=$(jq -er '.url' "$manifest")
        expected=$(jq -er '.sha256' "$manifest")
        [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $expected =~ ^[0-9a-f]{64}$ ]]
        test "$url" = "https://github.com/cli/cli/releases/download/v$version/gh_${version}_linux_amd64.tar.gz"
        destination=$(mktemp -d "$RUNNER_TEMP/github-cli.XXXXXX")
        curl --fail --location --proto '=https' --proto-redir '=https' \
          --connect-timeout 30 --max-time 300 --output "$destination/gh.tar.gz" "$url"
        echo "$expected  $destination/gh.tar.gz" | sha256sum --check --strict --status
        tar -xzf "$destination/gh.tar.gz" -C "$destination" --strip-components=2 "gh_${version}_linux_amd64/bin/gh"
        banner=$("$destination/gh" --version)
        [[ $banner == "gh version $version ("* ]]
        printf '%s\n' "$banner"
        echo "$destination" >> "$GITHUB_PATH"
