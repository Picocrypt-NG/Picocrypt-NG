# Desktop development tools; Android keeps its release toolchain below.
min_version = "2026.10.0"

[tools]
go = "1.27.3"
java = "temurin-21.0.13+9.0.LTS"
golangci-lint = "2.15.0"
hk = "2.11.1"
jactionlint = "2.4.0"
jouet = "0.0.3"
shellcheck = "0.11.0"
ruff = "0.17.3"
"go:golang.org/x/mobile/cmd/gobind" = "v0.0.0-20261011034528-197770444867"
"go:golang.org/x/mobile/cmd/gomobile" = "v0.0.0-20261011034528-197770444867"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[env]
# Preserve user/CI Android SDK settings; this default matches Android Studio on Linux.
ANDROID_HOME = { default = "{{ env.HOME }}/Android/Sdk" }
GOMOBILE_LDFLAGS = "-s -w -buildid="

[tasks.bootstrap]
description = "Install project tools and download Go module dependencies"
alias = "bs"
run = [
  "mise install",
  "cd src && go mod download",
  "mkdir -p \"$(go env GOPATH | cut -d: -f1)/pkg/gomobile\"",
]

[tasks.doctor]
description = "Print the active Picocrypt-NG toolchain"
alias = "d"
run = '''
#!/usr/bin/env bash
set -euo pipefail

echo "mise: $(mise --version)"
go version
java -version
echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
command -v gomobile
command -v gobind
command -v golangci-lint
command -v govulncheck
'''

[tasks.fmt]
description = "Check Go formatting"
dir = "src"
run = '''
#!/usr/bin/env bash
set -euo pipefail

unformatted="$(gofmt -l .)"
unformatted="$(printf '%s\n' "$unformatted" | grep -v '^testdata/legacy/' || true)"
if [ -n "$unformatted" ]; then
  echo "These files are not gofmt-clean (run: gofmt -w <file>):"
  echo "$unformatted"
  exit 1
fi
'''

[tasks."tooling:fmt"]
description = "Check Go production-KDF helper formatting"
run = '''
#!/usr/bin/env bash
set -euo pipefail

unformatted=$(gofmt -l .github/scripts/production-kdf.go .github/scripts/production-kdf_test.go)
if [ -n "$unformatted" ]; then
  echo "These Go tooling files are not gofmt-clean:"
  echo "$unformatted"
  exit 1
fi
'''

[tasks."tooling:lint"]
description = "Check Go production-KDF helpers with SARIF diagnostics"
run = "bash .github/scripts/lint-go.sh sarif tooling"

[tasks.vet]
description = "Run go vet with CGO enabled"
dir = "src"
run = "CGO_ENABLED=1 go vet -tags migrated_fynedo ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "bash .github/scripts/lint-go.sh json"

[tasks."lint:hk"]
description = "Run the same Go linters with SARIF diagnostics for hk"
run = "bash .github/scripts/lint-go.sh sarif"

[tasks."workflows:lint"]
description = "Check GitHub Actions with pinned offline jactionlint, ShellCheck and Ruff"
run = "bash .github/scripts/lint-workflows.sh"

[tasks."hk:check"]
description = "Check working-tree changes before a GitButler CLI commit"
run = "hk run check --safe --all"

[tasks."hk:all"]
description = "Run all check-only hk gates without staging or stashing"
run = "hk run check --safe --all"

[tasks."tooling:test"]
description = "Verify real hk diagnostics and Linux runner helpers (execute on Linux, otherwise compile only)"
run = "bash .github/scripts/test-go-tooling.sh"

[tasks.vuln]
description = "Run govulncheck"
dir = "src"
run = "govulncheck -tags migrated_fynedo ./..."

[tasks.test]
description = "Run the default Go test suite with serialized KDF-heavy packages"
alias = "t"
dir = "src"
run = "go test -p 1 -tags migrated_fynedo ./..."

[tasks."test:production-kdf"]
description = "Run the complete Linux native production-KDF operation and CLI lane separately"
run = "bash .github/scripts/test-production-kdf.sh"

[tasks."test:golden"]
description = "Run volume golden compatibility tests"
dir = "src"
run = "go test -count=1 -run '^TestGolden' ./internal/volume"

[tasks."test:cli"]
description = "Run CLI package tests"
dir = "src"
run = "go test ./internal/cli"

[tasks."test:cli-integration"]
description = "Run opt-in CLI stdin/stdout integration tests"
dir = "src"
run = "PICOCRYPT_RUN_CLI_INTEGRATION=1 go test ./internal/cli"

[tasks."test:race"]
description = "Run race-sensitive Go tests with bounded package parallelism"
dir = "src"
run = "CGO_ENABLED=1 go test -tags migrated_fynedo -race -p 1 -timeout 15m ./..."

[tasks."build:desktop"]
description = "Build the desktop GUI binary"
alias = "bd"
dir = "src"
run = "CGO_ENABLED=1 go build -tags migrated_fynedo -ldflags='-s -w' -o Picocrypt-NG ./cmd/picocrypt"

[tasks."build:cli"]
description = "Build the CLI-only binary"
alias = "bc"
dir = "src"
run = "CGO_ENABLED=1 go build -tags cli -ldflags='-s -w' -o Picocrypt-NG-cli ./cmd/picocrypt"

[tasks.check]
description = "Run local Go quality gates"
alias = "c"
run = [
  "mise run workflows:lint",
  "mise run fmt",
  "mise run tooling:fmt",
  "mise run tooling:lint",
  "mise run vet",
  "mise run lint",
  "mise run vuln",
  "mise run test",
]

[tasks."android:gomobile"]
description = "Build the Android gomobile AAR"
dir = "android"
tools.go = "1.27.3"
tools."go:golang.org/x/mobile/cmd/gobind" = "v0.0.0-20261011034528-197770444867"
tools."go:golang.org/x/mobile/cmd/gomobile" = "v0.0.0-20261011034528-197770444867"
run = "./build-gomobile.sh"

[tasks."android:test"]
description = "Run Android JVM tests after rebuilding the gomobile AAR"
depends = ["android:gomobile"]
dir = "android"
run = "./gradlew --no-daemon test"

[tasks."android:assemble-debug"]
description = "Assemble the Android debug APK after rebuilding the gomobile AAR"
depends = ["android:gomobile"]
dir = "android"
run = "./gradlew assembleDebug"

[tasks."android:build"]
description = "Run the project's Android debug build script"
alias = "ab"
depends = ["android:gomobile"]
dir = "android"
run = "./build-app"

[tasks."android:assemble-release"]
description = "Assemble unsigned/signed Android release APKs, depending on Gradle signing properties"
depends = ["android:gomobile"]
dir = "android"
run = "./gradlew assembleRelease"

[tasks.ci]
description = "Run local non-emulator CI gates"
run = [
  "mise run check",
  "mise run android:gomobile",
  "cd android && ./gradlew --no-daemon test assembleDebug",
]

[tasks.default]
description = "Run the default local validation suite"
depends = ["check"]
