version: "2"

run:
  timeout: 10m
  build-tags:
    - cli
  modules-download-mode: readonly
  # Lint test files too. Test code is production code: bugs and non-idiomatic
  # patterns there mislead just as much. (Previously false, which let test-only
  # issues slip the gate entirely.)
  tests: true

linters:
  default: standard
  enable:
    # Security + correctness
    - gosec
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - bodyclose # unclosed HTTP response bodies
    - nilerr # returns nil after a non-nil error check
    - makezero # make([]T, len) then append — silent prefix of zeros
    - errorlint # == / type-assert on errors instead of errors.Is/As
    # Idiomatic Go
    - intrange # for i := 0; i < n; i++  ->  for i := range n (Go 1.22+)
    - copyloopvar # redundant loop-var copy (Go 1.22+)
    - usestdlibvars # magic strings that have stdlib constants
    - unconvert # redundant type conversions
    - unparam # unused function params / results
    - perfsprint # fmt.Sprintf where a cheaper conversion exists
    - misspell # spelling in comments/strings
    - whitespace # leading/trailing whitespace in funcs
    - gocritic # opinionated but high-signal correctness/style checks
    - depguard
  exclusions:
    paths:
      - vendor
      - fyne
      - testdata
    presets:
      - std-error-handling
    rules:
      # Preserve the pinned Argon2 primitive's arithmetic and source structure.
      # These rules match only reviewed upstream expressions; local cleanup and
      # tests retain existing checks. Private mode values are the constants 0..2.
      - path: '^internal/argon2/argon2\.go$'
        linters: [gosec]
        text: '^G115: integer overflow conversion int -> uint(32|64)$'
        source: '^\s*(binary\.LittleEndian\.PutUint32\(params\[20:24\], uint32\(mode\)\)|in\[5\] = uint64\(mode\))$'
      # Argon2 encodes lengths as uint32. The valid protocol domain fits this
      # field; legacy callers do not independently reject larger inputs. Keep
      # that inherited out-of-domain behavior outside this cleanup-only patch.
      - path: '^internal/argon2/argon2\.go$'
        linters: [gosec]
        text: '^G115: integer overflow conversion int -> uint32$'
        source: '^\s*binary\.LittleEndian\.PutUint32\(tmp\[:\], uint32\(len\((password|salt|key|data)\)\)\)$'
      # Expansion outputs are uint32-sized keys or fixed initialization blocks.
      - path: '^internal/argon2/blake2b\.go$'
        linters: [gosec]
        text: '^G115: integer overflow conversion int -> uint32$'
        source: '^\s*binary\.LittleEndian\.PutUint32\(buffer\[:4\], uint32\(len\(out\)\)\)$'
      # The remainder is smaller than the nonzero uint32 lane length.
      - path: '^internal/argon2/argon2\.go$'
        linters: [gosec]
        text: '^G115: integer overflow conversion uint64 -> uint32$'
        source: '^\s*return lane\*lanes \+ uint32\(\(s\+m-\(p\+1\)\)%uint64\(lanes\)\)$'
      # BlaMka deliberately multiplies the low 32-bit limbs modulo 2^64.
      - path: '^internal/argon2/blamka_generic\.go$'
        linters: [gosec]
        text: '^G115: integer overflow conversion uint64 -> uint32$'
        source: '^\s*v[0-9]{2} \+= v[0-9]{2} \+ 2\*uint64\(uint32\(v[0-9]{2}\)\)\*uint64\(uint32\(v[0-9]{2}\)\)$'
      # Fixed 128-element blocks: row i<=112, column i<=14; max index 127.
      - path: '^internal/argon2/blamka_(amd64|generic)\.go$'
        linters: [gosec]
        text: '^G602: slice index out of range$'
        source: '^\s*&t\[i\+(0|4|8|12)\], &t\[i\+(1|5|9|13)\], &t\[i\+(2|6|10|14)\], &t\[i\+(3|7|11|15)\],$'
      - path: '^internal/argon2/blamka_(amd64|generic)\.go$'
        linters: [gosec]
        text: '^G602: slice index out of range$'
        source: '^\s*&t\[96\+i\], &t\[96\+i\+1\], &t\[112\+i\], &t\[112\+i\+1\],$'
      - path: '^internal/argon2/argon2\.go$'
        linters: [gocritic]
        text: '^captLocal:'
        source: '^func (processBlocks|extractKey)\(B blockWorkspace,'
      - path: '^internal/argon2/argon2\.go$'
        linters: [intrange]
        text: '^for loop can be changed to use an integer range'
        source: '^\s*for (lane := uint32\(0\); lane < threads(-1)?; lane\+\+|n := uint32\(0\); n < time; n\+\+|slice := uint32\(0\); slice < syncPoints; slice\+\+) \{$'
      - path: '^internal/argon2/argon2_test\.go$'
        linters: [intrange]
        text: '^for loop can be changed to use an integer range'
        source: '^\s*for i := 0; i < b\.N; i\+\+ \{$'
      - path: '^internal/argon2/argon2\.go$'
        linters: [staticcheck]
        text: '^ST1022:'
        source: '^// The Argon2 version implemented by this package\.$'
      # This fallback is used by purego/reference and Loong64 without LSX.
      - path: '^internal/argon2/blamka_generic\.go$'
        linters: [unused]
        text: '^func processBlockGeneric is unused$'
        source: '^func processBlockGeneric\(out, in1, in2 \*block, xor bool\) \{$'
      - path: internal/ui/
        linters:
          - typecheck
      # gosec G115 false positives: fd/syscall/size/color conversions are
      # bounded well below 2^63 by the surrounding format/protocol.
      - path: internal/fileops/
        linters:
          - gosec
        text: G115
      - path: internal/cli/
        linters:
          - gosec
        text: G115
      - path: internal/header/
        linters:
          - gosec
        text: G115
      # Platform false positive: appendOpenedPath/flushOpenedPaths and the
      # openedPathsNotify handler are called only from macos_open_darwin.go
      # (//go:build darwin), which the linux lint host never compiles, so the
      # unused linter cannot see their callers. Live + tested on macOS.
      - path: internal/ui/macos_open\.go
        linters:
          - unused
      # Frozen Unicode 17 normalizer support tracks the pinned x/text source
      # byte-for-byte except for the separately hashed supplementary-key
      # security guard. Keep security/correctness linters active; suppress only
      # upstream style/dead-code diagnostics that would require unrelated edits
      # to the reviewed frozen artifact.
      - path: internal/pcv3operation/internal/pcv3unicode/norm17/
        linters:
          - gocritic
          - intrange
          - perfsprint
          - unconvert
          - unparam
          - unused
      # Historical Unicode 15 is a frozen legacy-decryption compatibility
      # oracle. Preserve upstream structure; keep security linters active.
      - path: internal/password/legacyunicode15/
        linters:
          - gocritic
          - intrange
          - perfsprint
          - unconvert
          - unparam
          - unused
      # Tests legitimately ignore returns, use ad-hoc params, and trip the
      # production security scanner on fixtures (test passwords -> G101,
      # temp-dir perms -> G301/G302, controlled paths -> G703). gosec stays
      # full-strength on production code; excluding it in tests removes noise,
      # not coverage.
      - path: _test\.go
        linters:
          - errcheck
          - unparam
          - gosec
  settings:
    depguard:
      rules:
        native-frontends:
          list-mode: lax
          files:
            - "**/cmd/**/*.go"
            - "**/internal/ui/**/*.go"
            - "**/internal/cli/**/*.go"
            - "**/mobile/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "Picocrypt-NG/internal/argon2$"
              desc: "KDF operations belong behind the application boundary."
            - pkg: "Picocrypt-NG/internal/crypto$"
              desc: "Use the volume or pcv3operation application boundary."
            - pkg: "Picocrypt-NG/internal/pcv3operation/internal/"
              desc: "PCV3 implementation is private to pcv3operation."
            - pkg: "crypto/cipher$"
              desc: "Cipher operations belong behind the application boundary."
            - pkg: "crypto/aes$"
              desc: "Cipher operations belong behind the application boundary."
            - pkg: "crypto/hmac$"
              desc: "MAC operations belong behind the application boundary."
            - pkg: "golang.org/x/crypto/"
              desc: "KDF and cipher operations belong behind the application boundary."
            - pkg: "github.com/Picocrypt-NG/serpent$"
              desc: "Cipher operations belong behind the application boundary."
        pcv3-stream-engines:
          list-mode: lax
          files:
            - "**/pcv3operation/internal/pcv3/normal_writer.go"
            - "**/pcv3operation/internal/pcv3/d1_writer.go"
          deny:
            - pkg: "os$"
              desc: "Stream serializers accept readers/writers; filesystem work belongs in native adapters."
            - pkg: "path/filepath$"
              desc: "Stream serializers are path-free."
            - pkg: "Picocrypt-NG/internal/pcv3publication$"
              desc: "Publication belongs in native adapters."
            - pkg: "Picocrypt-NG/internal/fileops$"
              desc: "Filesystem operations belong in native adapters."
    gosec:
      excludes:
        - G304 # File inclusion via variable — expected for a file-encryption tool
        - G204 # Subprocess with variable — test builds
      config:
        global:
          nosec: true
          show-ignored: false
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
    staticcheck:
      checks:
        - "all"
        - "-QF1003" # tagged-switch suggestion — too pedantic
    gocritic:
      disabled-checks:
        - ifElseChain # if/else-if vs switch — style only, not a defect

formatters:
  enable:
    - gofmt
    - gofumpt # stricter superset of gofmt
    - goimports # import grouping/ordering
  exclusions:
    paths:
      - vendor
      - fyne
      - testdata
